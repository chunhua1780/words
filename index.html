<script>
"use strict";
const B=()=>Store.book;
const words=()=>wordsOf(B());
function findWord(w){w=norm(w);return Store.book?words().find(x=>norm(x.w)===w):null;}
let accent="us"; try{accent=localStorage.getItem("ws-accent")||"us";}catch(e){}

/* ================= Pronunciation: online human voice (Youdao, then Google), then the device voice ================= */
const player=new Audio(); player.preload="auto"; player.setAttribute("playsinline","");
let unlocked=false, actx=null;
function silentWav(){ // 0.1 s of silence, played on the first tap to unlock sound on iPad
  const n=800,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,"RIFF");v.setUint32(4,36+n,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,"data");v.setUint32(40,n,true);
  for(let i=0;i<n;i++)v.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}));
}
const SILENT=silentWav();
function unlock(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();}catch(e){}
  if(unlocked)return; unlocked=true;
  try{player.src=SILENT;player.play().catch(()=>{unlocked=false;});}catch(e){}
  try{if("speechSynthesis" in window){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}}catch(e){}
}
document.addEventListener("pointerdown",unlock,{capture:true});
document.addEventListener("keydown",unlock,{capture:true});
let voice=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const want=accent==="uk"?/en[-_]GB/i:/en[-_]US/i;
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const pref=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Daniel","Karen","Alex"];
  voice=vs.find(v=>want.test(v.lang)&&pref.some(n=>v.name.includes(n)))||vs.find(v=>want.test(v.lang))||vs[0]||null;
}
if("speechSynthesis" in window){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
let speakId=0;
function stopAudio(){speakId++;try{player.pause();}catch(e){} if("speechSynthesis" in window)speechSynthesis.cancel();}
function tts(text,{rate=.85,onend,id=++speakId}={}){
  let fired=false; const fire=()=>{if(!fired&&id===speakId){fired=true;onend&&onend();}};
  try{player.pause();}catch(e){}
  if(!("speechSynthesis" in window)){setTimeout(fire,300);return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang=accent==="uk"?"en-GB":"en-US"; u.rate=rate;
  if(voice)u.voice=voice;
  u.onend=fire; u.onerror=fire;
  speechSynthesis.speak(u);
  if(onend)setTimeout(fire,1500+text.length*180/rate);
}
function sources(text){
  const q=encodeURIComponent(text), uk=accent==="uk";
  return ["https://dict.youdao.com/dictvoice?type="+(uk?1:2)+"&audio="+q,
          "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+(uk?"en-GB":"en-US")+"&q="+q];
}
let tipShown=false;
function showSoundTip(){
  if(tipShown)return; tipShown=true; const t=$("#soundTip");
  t.textContent="No sound? Tap any 🔊 button. Check the iPad isn't on Silent (swipe down from the top right, look at the bell) and the volume is up.";
  t.hidden=false; setTimeout(()=>t.hidden=true,8000);
}
function say(text,{slow=false,onend}={}){
  if(!text)return;
  if("speechSynthesis" in window)speechSynthesis.cancel();
  const id=++speakId;
  let fired=false; const fire=()=>{if(!fired&&id===speakId){fired=true;onend&&onend();}};
  const list=navigator.onLine===false?[]:sources(text);
  const w=findWord(text); if(w&&w.audio)list.push(w.audio);
  let k=-1, started=false;
  const tryNext=()=>{
    if(id!==speakId)return;
    k++; started=false;
    if(k>=list.length){tts(text,{rate:slow?.5:.85,onend,id});return;}
    player.onended=fire;
    player.onplaying=()=>{started=true;};
    player.onerror=()=>{if(id===speakId&&k<list.length)tryNext();};
    player.src=list[k];
    try{player.playbackRate=slow?.65:1;player.defaultPlaybackRate=slow?.65:1;player.preservesPitch=true;}catch(e){}
    const kk=k;
    player.play().then(()=>{try{player.playbackRate=slow?.65:1;}catch(e){}}).catch(err=>{
      if(id!==speakId||kk!==k)return;
      if(err&&err.name==="NotAllowedError"){showSoundTip();k=list.length;tts(text,{rate:slow?.5:.85,onend,id});}
      else tryNext();
    });
    setTimeout(()=>{if(id===speakId&&kk===k&&!started)tryNext();},4000);
  };
  tryNext();
  if(onend)setTimeout(fire,slow?9000:7000);
}
function spellOut(w,svgSel){
  const letters=[...w]; let i=0;
  const step=()=>{
    document.querySelectorAll(svgSel+" tspan").forEach(t=>t.classList.remove("hl"));
    if(i>=letters.length){say(w);return;}
    const t=document.querySelector(`${svgSel} tspan[data-i="${i}"]`); if(!t)return; t.classList.add("hl");
    const ch=letters[i++];
    if(!/[a-z]/i.test(ch)){setTimeout(step,250);return;}
    if(voice)tts(ch.toUpperCase(),{rate:.8,onend:()=>setTimeout(step,120)});
    else say(ch.toUpperCase(),{onend:()=>setTimeout(step,120)});
  };
  step();
}
function beep(ok,big){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?(big?[523,659,784,1047]:[660,880]):[220,180];
    notes.forEach((f,k)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type=ok?"sine":"square";
      const t0=actx.currentTime+k*.1;
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(ok?.16:.05,t0+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t0+.15);o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+.18);});
  }catch(e){}
}

/* ================= Phonics: syllables, sound chunks, tricky bits ================= */
function syllables(word){
  if(/[^a-z']/i.test(word)||word.length<4)return [word];
  const lw=word.toLowerCase(), n=lw.length;
  const isV=i=>"aeiou".includes(lw[i])||(lw[i]==="y"&&i>0&&!"aeiou".includes(lw[i-1]));
  const g=[]; for(let i=0;i<n;){if(isV(i)){let j=i;while(j<n&&isV(j))j++;g.push([i,j]);i=j;}else i++;}
  if(g.length>1){const last=g[g.length-1];
    if(last[0]===n-1&&lw[n-1]==="e"&&!(lw[n-2]==="l"&&n>2&&!isV(n-3)))g.pop();
    else if(last[0]===n-2&&/e[sd]$/.test(lw)&&!/[td]ed$|[sxz]es$|[cs]hes$/.test(lw))g.pop();}
  if(g.length<2)return [word];
  const DI=["ch","sh","th","ph","wh","gh"], AFTER=["ck","ng"], BL=["bl","br","cl","cr","dr","fl","fr","gl","gr","pl","pr","tr","wr"];
  const cuts=[];
  for(let k=0;k<g.length-1;k++){
    const s=g[k][1], e=g[k+1][0], num=e-s; let cut;
    if(k===g.length-2&&e===n-1&&lw[n-1]==="e"&&lw[n-2]==="l")cut=e-2;
    else if(num<=1)cut=lw[s]==="x"?s+1:s;
    else{const p=lw.slice(s,s+2);
      if(num===2&&(DI.includes(p)||BL.includes(p)))cut=s;
      else if(AFTER.includes(p))cut=(p==="ng"&&"eiy".includes(lw[s+2]))?s+1:s+2;
      else cut=s+1;}
    if(cut>(cuts[cuts.length-1]||0)&&cut<n)cuts.push(cut);
  }
  const out=[];let p=0;cuts.forEach(c=>{out.push(word.slice(p,c));p=c;});out.push(word.slice(p));
  return out.filter(Boolean);
}
/* Word endings that are spelled differently from how they sound */
const SUFFIX=[["tial","shul"],["cial","shul"],["tion","shun"],["sion","shun"],["cious","shus"],["tious","shus"],["ture","cher"],["sure","zher"],
  ["ible","ih-bul"],["able","uh-bul"],["ous","us"],["ence","ence"],["ance","ance"],["ment","ment"],["ness","ness"],["less","less"],["ful","ful"],["ing","ing"]];
const SUFFIX_ALT={tial:["cial"],cial:["tial"],tion:["sion"],sion:["tion"],cious:["tious"],tious:["cious"],ture:["cher"],
  ible:["able"],able:["ible"],ence:["ance"],ance:["ence"],ous:["us"],ment:["mant"],ful:["full"],less:["les"]};
function chunksOf(word){
  if(/\s/.test(word))return word.split(/\s+/).flatMap(chunksOf);
  const lw=word.toLowerCase();
  for(const [s] of SUFFIX)if(lw.endsWith(s)&&lw.length>=s.length+3)return [...syllables(word.slice(0,-s.length)),word.slice(-s.length)];
  return syllables(word);
}
function soundOf(chunk,last){
  if(last){const s=SUFFIX.find(([x])=>x===chunk.toLowerCase());if(s)return s[1];}
  return chunk;
}
function trickyOf(word){
  const lw=word.toLowerCase(), out=[];
  const ch=chunksOf(word), last=ch[ch.length-1].toLowerCase(), suf=SUFFIX.find(([x])=>x===last);
  if(ch.length>1&&suf&&suf[1]!==last)out.push(`<b>${esc(last)}</b> sounds like “${esc(suf[1])}”`);
  [...new Set(lw.match(/([a-z])\1/g)||[])].forEach(d=>out.push(`Double letters: <b>${esc(d)}</b>`));
  if(/^kn/.test(lw))out.push(`<b>k</b> is silent in <b>kn</b>`);
  if(/^wr/.test(lw))out.push(`<b>w</b> is silent in <b>wr</b>`);
  if(/mb$/.test(lw))out.push(`<b>b</b> is silent at the end`);
  if(/igh|ght/.test(lw))out.push(`<b>gh</b> is silent`);
  if(/ei/.test(lw))out.push(`<b>ei</b>: e before i here`);
  if(/ie/.test(lw)&&!/ie$/.test(lw))out.push(`<b>ie</b>: i before e here`);
  return out.slice(0,3);
}
function chunkRow(word,id){
  const ch=chunksOf(word);
  return `<div class="chunks" id="${id}">${ch.map((c,k)=>{const s=soundOf(c,k===ch.length-1);
    return `<button class="chunk" data-k="${k}" data-say="${esc(s)}"><b>${esc(c)}</b><small>${s.toLowerCase()!==c.toLowerCase()?"says “"+esc(s)+"”":""}</small></button>`;}).join("")}</div>`;
}
/* Sound it out: each chunk, then the whole word */
function soundOut(word,rowId){
  const ch=chunksOf(word); let k=0;
  const row=()=>document.getElementById(rowId);
  const step=()=>{
    if(!row())return;
    row().querySelectorAll(".chunk").forEach(b=>b.classList.remove("hl"));
    if(k>=ch.length){setTimeout(()=>say(word),250);return;}
    const b=row().querySelector(`[data-k="${k}"]`); if(b)b.classList.add("hl");
    const s=soundOf(ch[k],k===ch.length-1); k++;
    say(s,{onend:()=>setTimeout(step,250)});
  };
  step();
}
function bindChunks(st){st.querySelectorAll(".chunk[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));}

/* ================= Four-line handwriting grid ================= */
function grid(word,{id="g"}={}){
  const n=Math.max(word.length,5);
  let spans="", i=0;
  const parts=/\s/.test(word)?[word]:chunksOf(word);
  parts.forEach((p,k)=>{for(const ch of p){
    const cls=parts.length>1?(k%2?"s2":"s1"):"";
    spans+=`<tspan data-i="${i}" class="${cls}">${esc(ch===" "?"\u00a0":ch)}</tspan>`; i++;}});
  return `<svg class="grid4" id="${id}" style="--n:${n}" aria-label="${esc(word)}">
    <line x1="0" x2="100%" y1="1" y2="1"/><line x1="0" x2="100%" y1="33.33%" y2="33.33%"/>
    <line class="base" x1="0" x2="100%" y1="66.67%" y2="66.67%"/><line x1="0" x2="100%" y1="99%" y2="99%"/>
    <text x="50%" y="66.67%" text-anchor="middle">${spans}</text></svg>`;
}

/* ================= Online lookup: phonetic spelling, example sentence, recorded voice ================= */
async function fetchJSON(url,ms=6000){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(url,{signal:ctl.signal}); if(!r.ok)return null; return await r.json();}catch(e){return null;}finally{clearTimeout(t);}
}
async function enrich(word){
  const j=await fetchJSON("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word.w.toLowerCase()));
  word.enr=1;
  if(!Array.isArray(j))return;
  const e=j[0]; const phs=e.phonetics||[];
  const ph=e.phonetic||phs.map(p=>p.text).find(Boolean);
  if(ph&&!word.ipa)word.ipa=ph.startsWith("/")?ph:"/"+ph+"/";
  const au=phs.find(p=>p.audio&&/-us\./.test(p.audio))||phs.find(p=>p.audio);
  if(au&&!word.audio)word.audio=au.audio;
  if(!word.ex){
    for(const m of e.meanings||[])for(const d of m.definitions||[])
      if(d.example&&d.example.split(" ").length<=14&&new RegExp("\\b"+word.w.split(" ")[0].slice(0,5),"i").test(d.example)){word.ex=d.example.replace(/^./,c=>c.toUpperCase());return;}
  }
}
let enriching=false;
async function enrichAll(){ // words added on the parent page are looked up here, a few at a time
  if(enriching||!Store.book)return; enriching=true;
  const todo=words().filter(w=>!w.enr).slice(0,30);
  for(let i=0;i<todo.length;i+=5)await Promise.all(todo.slice(i,i+5).map(enrich));
  if(todo.length){todo.forEach(w=>w.u=Date.now());Store.save();}
  enriching=false;
}

/* ================= Misspellings for "Pick the right spelling" ================= */
function misspellings(w,n=3){
  const s=w.toLowerCase(), out=new Set(), V="aeiou";
  for(let i=1;i<s.length-1;i++)if(s[i]!==s[i+1]&&s[i]!==" "&&s[i+1]!==" ")out.add(s.slice(0,i)+s[i+1]+s[i]+s.slice(i+2));
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(i<s.length-1&&c===s[i+1])out.add(s.slice(0,i)+s.slice(i+1));
    else if(/[bcdfglmnprst]/.test(c)&&i>0)out.add(s.slice(0,i)+c+s.slice(i));
    if(V.includes(c)){out.add(s.slice(0,i)+s.slice(i+1)); for(const v of V)if(v!==c)out.add(s.slice(0,i)+v+s.slice(i+1));}
  }
  [["ie","ei"],["ei","ie"],["ph","f"],["c","k"],["tion","sion"],["sion","tion"],["tial","cial"],["cial","tial"],["ible","able"],["able","ible"],["ence","ance"],["ance","ence"],
   ["ck","k"],["ee","ea"],["ea","ee"],["ou","ow"],["ow","ou"],["er","ur"],["ai","ay"],["ay","ai"],["ous","us"]]
    .forEach(([a,b])=>{if(s.includes(a))out.add(s.replace(a,b));});
  out.delete(s);
  const all=[...out].filter(x=>x.length>1&&x.trim()===x);
  const pri=all.filter(x=>/tial|cial|tion|sion|ible|able|ence|ance/.test(x)&&x.length===s.length);
  const fix=x=>w[0]===w[0].toUpperCase()?x[0].toUpperCase()+x.slice(1):x;
  return [...new Set([...shuffle(pri).slice(0,1),...shuffle(all)])].slice(0,n).map(fix);
}

const SETS={

  all:{name:"All words",get:()=>words()},

try{tab=sessionStorage.getItem("tab")||"today";practiceSet=sessionStorage.getItem("pset")||"today";}catch(e){}

$("#accent").onclick=()=>{accent=accent==="uk"?"us":"uk";try{localStorage.setItem("ws-accent",accent)}catch(e){}pickVoice();render();say("hello");};

function viewLogin(){
  const create=authMode==="create";

/* ================= Drag and drop (finger, mouse or Apple Pencil) ================= */
function makeDrag(el,{onTap,onDrop,target=".drop"}){
  el.onclick=e=>{if(e.detail===0)onTap();}; // keyboard
  el.onpointerdown=e=>{
    if(el.classList.contains("used"))return;
    e.preventDefault();
    const sx=e.clientX, sy=e.clientY; let ghost=null, dx=0, dy=0;
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    const over=t=>{document.querySelectorAll(".over").forEach(s=>s.classList.remove("over"));const s=t&&t.closest(target);if(s)s.classList.add("over");return s;};
    const move=ev=>{
      if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){
        const r=el.getBoundingClientRect(); ghost=el.cloneNode(true); ghost.classList.add("ghost");
        Object.assign(ghost.style,{position:"fixed",left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px",pointerEvents:"none",zIndex:50,margin:0});
        document.body.appendChild(ghost); dx=sx-r.left; dy=sy-r.top; el.classList.add("lift");
      }
      if(ghost){ghost.style.left=(ev.clientX-dx)+"px";ghost.style.top=(ev.clientY-dy)+"px";over(document.elementFromPoint(ev.clientX,ev.clientY));}
    };
    const up=ev=>{
      el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);
      document.querySelectorAll(".over").forEach(s=>s.classList.remove("over"));
      if(ghost){ghost.remove();el.classList.remove("lift");if(ev.type==="pointerup"){const t=document.elementFromPoint(ev.clientX,ev.clientY);onDrop(t&&t.closest(target));}}
      else if(ev.type==="pointerup")onTap();
    };
    el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  };
}

/* ================= Handwriting pad ================= */
function writePad(box,{trace}={}){
  box.innerHTML=`<div class="pad"><canvas aria-label="Writing area"></canvas></div>`;
  const cv=box.querySelector("canvas"), ctx=cv.getContext("2d");
  const css=getComputedStyle(document.documentElement);
  const col=n=>css.getPropertyValue(n).trim();
  let strokes=[], cur=null;
  const dpr=()=>window.devicePixelRatio||1;
  const draw=()=>{
    const W=cv.width/dpr(), H=cv.height/dpr();
    ctx.clearRect(0,0,W,H);
    const top=H*.12, h=(H*.8)/3;
    [0,1,2,3].forEach(i=>{ctx.beginPath();ctx.strokeStyle=i===2?col("--baseline"):col("--line");ctx.lineWidth=i===2?1.5:1;ctx.moveTo(0,top+h*i);ctx.lineTo(W,top+h*i);ctx.stroke();});
    if(trace){const fs=Math.min(h*2,(W-30)/(trace.length*.56));ctx.font=`${fs}px Andika, "Comic Sans MS", sans-serif`;ctx.textAlign="center";ctx.textBaseline="alphabetic";
      ctx.fillStyle=col("--line");ctx.fillText(trace,W/2,top+h*2);}
    ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=col("--ink");
    strokes.forEach(s=>{ctx.lineWidth=s.w;ctx.beginPath();s.p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(s.p.length===1)ctx.lineTo(s.p[0][0]+.1,s.p[0][1]);ctx.stroke();});
  };
  const size=()=>{const r=cv.getBoundingClientRect();if(!r.width)return;cv.width=r.width*dpr();cv.height=r.height*dpr();ctx.setTransform(dpr(),0,0,dpr(),0,0);draw();};
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}cur={w:e.pointerType==="pen"?3.5:5,p:[pt(e)]};strokes.push(cur);draw();};
  cv.onpointermove=e=>{if(!cur)return;(e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>cur.p.push(pt(ev)));draw();};
  cv.onpointerup=cv.onpointercancel=()=>{cur=null;};
  size(); requestAnimationFrame(size);
  if(window.ResizeObserver)new ResizeObserver(size).observe(cv);
  return {clear(){strokes=[];draw();},empty:()=>!strokes.length};
}

/* ================= Practice engine ================= */
let S=null, timerH=null;
const MODE_NAME={learn:"New Words",review:"Review",full:"All 5 Steps",dict:"Dictation",lcwc:"Cover & Write",game:"Spelling Game",phonics:"Phonics Chunks",mock:"Practice Test"};
const WRITES={learn:1,review:1,full:1,dict:1,lcwc:1,mock:1};
function fullTasks(ids,tasks){
  const groups=[]; for(let i=0;i<ids.length;i+=5)groups.push(ids.slice(i,i+5));
  groups.forEach((g,k)=>{
    tasks.push({t:"intro",title:groups.length>1?`Group ${k+1} of ${groups.length}`:`${g.length} new word${g.length===1?"":"s"}`,sub:"First sound out each word. Then put the chunks in order, build it and write it.",ids:g});
    g.forEach(id=>tasks.push({t:"preview",id}));
    shuffle(g).forEach(id=>tasks.push({t:chunksOf(B().words[id].w).length>1?"chunks":"pick",id}));
    shuffle(g).forEach(id=>tasks.push({t:"tiles",id}));
    shuffle(g).forEach(id=>tasks.push({t:"lcwc",id}));
  });
  tasks.push({t:"intro",title:"Final dictation",sub:`Listen and spell all ${ids.length} words. Any mistakes come back once more.`});
  shuffle(ids).forEach(id=>tasks.push({t:"dict",id}));
}
function startSession(mode,ids,opt={}){
  ids=ids.filter(id=>B().words[id]); if(!ids.length)return;
  const tasks=[], n=ids.length, s=n===1?"":"s";
  if(mode==="learn"||mode==="full")fullTasks(ids,tasks);
  else if(mode==="review"){
    tasks.push({t:"intro",title:`Review ${n} word${s}`,sub:"Pick the right spelling, then spell each word from dictation."});
    shuffle(ids).forEach(id=>tasks.push({t:"pick",id}));
    shuffle(ids).forEach(id=>tasks.push({t:"dict",id}));
  }else if(mode==="dict"){
    tasks.push({t:"intro",title:`Dictation · ${n} word${s}`,sub:"Listen, spell the word, then check. Tap Sentence to hear it used."});
    shuffle(ids).forEach(id=>tasks.push({t:"dict",id}));
  }else if(mode==="lcwc"){
    tasks.push({t:"intro",title:`Cover & Write · ${n} word${s}`,sub:"Look carefully, cover the word, write it from memory, then check."});
    shuffle(ids).forEach(id=>tasks.push({t:"lcwc",id}));
  }else if(mode==="phonics"){
    tasks.push({t:"intro",title:`Phonics Chunks · ${n} word${s}`,sub:"Hear each sound chunk, then put the chunks in the right order."});
    shuffle(ids).forEach(id=>{tasks.push({t:"preview",id,quick:true});tasks.push({t:chunksOf(B().words[id].w).length>1?"chunks":"pick",id});});
  }else if(mode==="mock"){
    tasks.push({t:"intro",title:`Practice Test · ${n} word${s}`,sub:"Just like the school test: you hear each word and a sentence. You see your marks at the end."});
    shuffle(ids).forEach(id=>tasks.push({t:"mock",id}));
  }else if(mode==="game"){
    tasks.push({t:"intro",title:`Spelling Game · ${n} word${s}`,sub:"Listen and tap or drag the letters. Streaks earn bonus points, wrong letters lose points. Be quick!",game:true});
    shuffle(ids).forEach(id=>tasks.push({t:"game",id,kind:Math.random()<.5?"build":"gap"}));
  }
  S={mode,ids,tasks,i:0,res:Object.fromEntries(ids.map(id=>[id,{first:null,tries:0,ans:""}])),score:0,combo:0,hits:0,misses:0,t0:0,testId:opt.testId||null};
  window.__busy=true;
  $("#hud").hidden=mode!=="game";
  $("#session").hidden=false; document.body.style.overflow="hidden";
  renderTask();
}
function endSession(){S=null;window.__busy=false;clearInterval(timerH);$("#session").hidden=true;document.body.style.overflow="";stopAudio();render();}
$("#quit").onclick=()=>{
  const b=$("#quit");
  if(!S||S.tasks[S.i]?.t==="done"){endSession();return;}
  if(!b.classList.contains("confirm")){b.classList.add("confirm");b.textContent="Quit?";setTimeout(()=>{b.classList.remove("confirm");b.textContent="✕";},2500);return;}
  b.classList.remove("confirm");b.textContent="✕";endSession();
};
function next(){stopAudio();S.i++;renderTask();}
const autoNext=ms=>{const i0=S.i;setTimeout(()=>{if(S&&S.i===i0)next();},ms);};

const LABEL={preview:"Sound it out",pick:"Pick",chunks:"Chunks",tiles:"Build",lcwc:"Cover & Write",dict:"Dictation",game:"Spelling Game",mock:"Practice Test",done:"Done"};
function renderTask(){
  if(!S.tasks[S.i])S.tasks.push({t:"done"});
  const task=S.tasks[S.i];
  if(task.id&&!B().words[task.id]){S.i++;return renderTask();} // word deleted on another device

}
const panes=(a,b)=>`<div class="pa">${a}</div><div class="pb">${b}</div>`;
function sayBtns(w,{svg,sentence=true,slow=true,sound=false}={}){

}
function bindSay(st,w,svg,chunkId){

function focusIn(el){setTimeout(()=>{try{el.focus({preventScroll:true})}catch(e){}},60);}

function tPick(st,task,w){

/* Step 2: put the sound chunks in order (look-alike chunks are mixed in) */
function tChunks(st,task,w){
  const ch=chunksOf(w.w);
  const extra=new Set();
  (SUFFIX_ALT[ch[ch.length-1].toLowerCase()]||[]).slice(0,1).forEach(x=>extra.add(x));
  ch.slice(0,-1).forEach(c=>{if(extra.size<2&&c.length>=2){const m=misspellings(c,1)[0];if(m&&!ch.map(x=>x.toLowerCase()).includes(m.toLowerCase()))extra.add(m);}});
  const tiles=shuffle([...ch.map(c=>({c})),...[...extra].slice(0,2).map(c=>({c}))]);
  let pos=0, miss=0;
  st.innerHTML=panes(`<div class="kind">Put the chunks in order</div>
    <div class="headphones">🎧</div>
    ${sayBtns(w,{sentence:false,sound:true})}
    <div id="hintBox" hidden>${chunkRow(w.w,"ckh")}</div>`,
    `<div class="cslots" id="cslots"></div><div class="ctiles" id="ctiles"></div><div id="fb" class="muted small">Tap or drag the chunks in order. Watch out for look-alikes!</div>`);
  const drawSlots=()=>{$("#cslots").innerHTML=ch.map((c,k)=>`<span class="cslot ${k<pos?"":"drop"} ${k===pos?"next":""}" data-k="${k}">${k<pos?esc(c):""}</span>`).join("");};
  drawSlots();
  $("#ctiles").innerHTML=tiles.map((t,i)=>`<button class="ctile" data-i="${i}">${esc(t.c)}</button>`).join("");
  bindSay(st,w,null,"ckh"); bindChunks(st);
  say(w.w);
  const place=(el,slotK)=>{
    if(pos>=ch.length||el.classList.contains("used"))return;
    if(slotK!=null&&slotK!==pos)return;
    const t=tiles[el.dataset.i];
    if(t.c===ch[pos]){
      el.classList.add("used"); pos++; drawSlots(); say(soundOf(ch[pos-1],pos===ch.length));
      if(pos===ch.length){beep(true);$("#fb").innerHTML=`<span class="ok-t" style="font-size:20px">Well done!</span>`;setTimeout(()=>{if(S)say(w.w);},800);autoNext(2000);}
    }else{
      miss++;beep(false);el.classList.remove("bad");void el.offsetWidth;el.classList.add("bad");
      if(miss>=2)$("#hintBox").hidden=false;
    }
  };
  st.querySelectorAll(".ctile").forEach(el=>makeDrag(el,{target:".cslot.drop",onTap:()=>place(el,null),onDrop:s=>{if(s)place(el,+s.dataset.k);}}));
}

/* Letter tiles in order (Build step and Spelling Game): tap or drag */
let kbHandler=null;
function letterBoard(st,w,{blanks,extra=0,onHit,onMiss,onDone,hintAfter=3}){
  const letters=[...w.w];
  const need=blanks.slice();
  const pool=need.map(i=>letters[i]);
  const abc="abcdefghijklmnopqrstuvwxyz".split("").filter(c=>!letters.map(x=>x.toLowerCase()).includes(c));
  for(let k=0;k<extra;k++)pool.push(abc[Math.random()*abc.length|0]);
  const tiles=shuffle(pool.map(c=>({c})));
  let miss=0, done=false; const filled=new Set();
  const nextIdx=()=>need.find(i=>!filled.has(i));
  const slotsHtml=()=>{const nx=nextIdx();return letters.map((c,i)=>c===" "?`<span class="slot gap"></span>`:
    need.includes(i)?`<span class="slot ${filled.has(i)?"filled":"drop"} ${i===nx?"next":""}" data-i="${i}">${filled.has(i)?esc(c):""}</span>`:`<span class="slot given">${esc(c)}</span>`).join("");};
  $("#slots").innerHTML=slotsHtml();
  $("#tiles").innerHTML=tiles.map((t,k)=>`<button class="tile" data-k="${k}">${esc(t.c)}</button>`).join("");
  const place=(b,slot)=>{
    if(done||b.classList.contains("used"))return;
    const t=tiles[b.dataset.k], i=slot==null?nextIdx():slot;
    if(i==null||filled.has(i))return;
    if(t.c.toLowerCase()===letters[i].toLowerCase()){
      b.classList.add("used"); filled.add(i); $("#slots").innerHTML=slotsHtml();
      st.querySelectorAll(".tile.hint").forEach(x=>x.classList.remove("hint"));
      onHit&&onHit();
      if(filled.size===need.length){done=true;document.removeEventListener("keydown",kbHandler);onDone(miss);}
    }else{
      miss++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad");
      onMiss&&onMiss();
      if(miss>=hintAfter){const nx=nextIdx();const h=[...st.querySelectorAll(".tile:not(.used)")].find(x=>tiles[x.dataset.k].c.toLowerCase()===letters[nx].toLowerCase()); if(h)h.classList.add("hint");}
    }
  };
  st.querySelectorAll(".tile").forEach(b=>makeDrag(b,{target:".slot.drop",onTap:()=>place(b,null),onDrop:s=>{if(s)place(b,+s.dataset.i);}}));
  if(kbHandler)document.removeEventListener("keydown",kbHandler);
  kbHandler=e=>{if(!S||done||e.key.length!==1||!/[a-z'\-]/i.test(e.key)||e.target.tagName==="INPUT")return;
    const cand=[...st.querySelectorAll(".tile:not(.used)")]; if(!cand.length)return;
    const nx=nextIdx();
    const b=cand.find(x=>tiles[x.dataset.k].c.toLowerCase()===e.key.toLowerCase()&&nx!=null&&e.key.toLowerCase()===letters[nx].toLowerCase())||cand.find(x=>tiles[x.dataset.k].c.toLowerCase()===e.key.toLowerCase())||cand[0];
    place(b,null);};
  document.addEventListener("keydown",kbHandler);
}

/* Free letter tiles for dictation (no hints): tap or drag into any box, tap a box to take the letter back */
function freeBoard(box,w,onChange){
  const letters=[...w.w];
  const pool=letters.filter(c=>c!==" ");
  const abc="abcdefghijklmnopqrstuvwxyz";
  for(let k=0;k<3;k++)pool.push(abc[Math.random()*26|0]);
  const tiles=shuffle(pool);
  const slotOf=letters.map(()=>null);
  box.innerHTML=`<div class="slots fs"></div><div class="tiles ft"></div>`;
  const tileEl=k=>box.querySelector(`.tile[data-k="${k}"]`);
  const draw=()=>{
    box.querySelector(".fs").innerHTML=letters.map((c,i)=>c===" "?`<span class="slot gap"></span>`:`<span class="slot drop fslot ${slotOf[i]!=null?"filled":""}" data-i="${i}">${slotOf[i]!=null?esc(tiles[slotOf[i]]):""}</span>`).join("");
    box.querySelectorAll(".fslot").forEach(s=>s.onclick=()=>{const i=+s.dataset.i;if(slotOf[i]!=null){tileEl(slotOf[i]).classList.remove("used");slotOf[i]=null;draw();}});
    onChange(letters.every((c,i)=>c===" "||slotOf[i]!=null),letters.map((c,i)=>c===" "?" ":(slotOf[i]!=null?tiles[slotOf[i]]:"")).join(""));
  };
  box.querySelector(".ft").innerHTML=tiles.map((c,k)=>`<button class="tile" data-k="${k}">${esc(c)}</button>`).join("");
  const put=(b,slot)=>{
    const k=+b.dataset.k; if(b.classList.contains("used"))return;
    const i=slot==null?letters.findIndex((c,j)=>c!==" "&&slotOf[j]==null):slot;
    if(i<0)return;
    if(slotOf[i]!=null)tileEl(slotOf[i]).classList.remove("used");
    slotOf[i]=k; b.classList.add("used"); draw();
  };
  box.querySelectorAll(".tile").forEach(b=>makeDrag(b,{target:".fslot",onTap:()=>put(b,null),onDrop:s=>{if(s)put(b,+s.dataset.i);}}));
  draw();
}

function tTiles(st,task,w){
  st.innerHTML=panes(`<div class="kind">Build the word</div>

    ${sayBtns(w,{sentence:false})}

}

function updHud(){

function tGame(st,task,w){
  const idx=[...w.w].map((c,i)=>c===" "?-1:i).filter(i=>i>=0);
  let blanks=idx;
  if(task.kind==="gap"&&idx.length>=3){const k=Math.min(idx.length-1,Math.max(2,Math.round(idx.length*.5)));blanks=shuffle(idx).slice(0,k).sort((a,b)=>a-b);}
  const n=S.tasks.filter(t=>t.t==="game").length, cur=S.tasks.slice(0,S.i+1).filter(t=>t.t==="game").length;
  st.innerHTML=panes(`<div class="kind">Word ${cur} of ${n} · ${blanks.length===idx.length?"Spell the whole word":"Fill in the missing letters"}</div>

  bindSay(st,w); say(w.w);

    onHit:()=>{S.hits++;S.combo++;S.score+=10+Math.min(S.combo,10)*2;beep(true);updHud();const h=$("#hScore");h.classList.remove("pop");void h.offsetWidth;h.classList.add("pop");},
    onMiss:()=>{S.misses++;S.combo=0;S.score=Math.max(0,S.score-3);updHud();if(S.res[w.id].first===null)S.res[w.id].first=false;},

      $("#fb").innerHTML=`<span class="ok-t" style="font-size:20px">${miss?"Done!":"Perfect! +20"}</span>`;
      beep(true,!miss); say(w.w); autoNext(1100);
    }});
}

function lcsMask(ans,cor){
  const a=[...norm(ans)],c=[...cor.toLowerCase()],m=a.length,n=c.length;
  const dp=[...Array(m+1)].map(()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=a[i]===c[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const keepA=Array(m).fill(false),keepC=Array(n).fill(false);let i=0,j=0;
  while(i<m&&j<n){if(a[i]===c[j]){keepA[i]=keepC[j]=true;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
  return {keepA,keepC};
}
function youWrote(ans,cor){const {keepA}=lcsMask(ans,cor);return [...norm(ans)].map((ch,i)=>keepA[i]?`<span class="k">${esc(ch)}</span>`:`<span class="x">${esc(ch)}</span>`).join("")||"<span class='muted'>(empty)</span>";}
function diffHtml(ans,cor){
  const {keepC}=lcsMask(ans,cor);
  const c=[...cor].map((ch,i)=>keepC[i]?esc(ch):`<span class="m">${esc(ch)}</span>`).join("");
  return `<div class="muted small">You wrote</div><div class="diff">${youWrote(ans,cor)}</div><div class="muted small" style="margin-top:6px">Correct spelling (red letters are the ones to fix)</div><div class="diff" style="color:var(--fg)">${c}</div>`;
}

/* The answer area for the chosen method. submit(text) for typing and tiles; submit(null) for handwriting (checked by the child). */
function answerArea(box,w,{submit,label="Check",placeholder="Spell the word"}){
  const m=method();
  if(m==="type"){
    box.innerHTML=`<input ${inputAttrs} class="answer" placeholder="${placeholder}"><div><button class="btn primary big chk">${label}</button></div>`;
    const inp=box.querySelector("input"); focusIn(inp);
    const go=()=>{if(inp.value.trim())submit(inp.value);};
    box.querySelector(".chk").onclick=go; inp.onkeydown=e=>{if(e.key==="Enter")go();};
    return {mark:ok=>inp.classList.add(ok?"ok":"no"),reset(){inp.value="";inp.classList.remove("no","ok");focusIn(inp);},setLabel:t=>box.querySelector(".chk").textContent=t};
  }
  if(m==="tiles"){
    box.innerHTML=`<div class="fbx"></div><div><button class="btn primary big chk" disabled>${label}</button></div>`;
    let ans="";
    const build=()=>freeBoard(box.querySelector(".fbx"),w,(full,a)=>{ans=a;box.querySelector(".chk").disabled=!full;});
    build();
    box.querySelector(".chk").onclick=()=>submit(ans);
    return {mark(){},reset:build,setLabel:t=>box.querySelector(".chk").textContent=t};
  }
  box.innerHTML=`<div class="padBox"></div><div class="pad-tools"><button class="btn clr">🧽 Clear</button><button class="btn primary big chk">${label}</button></div>`;
  let pad=writePad(box.querySelector(".padBox"));
  box.querySelector(".clr").onclick=()=>pad.clear();
  box.querySelector(".chk").onclick=()=>{if(!pad.empty())submit(null);};
  return {mark(){},reset(trace){pad=writePad(box.querySelector(".padBox"),{trace});},setLabel:t=>box.querySelector(".chk").textContent=t};
}
/* Handwriting check: show the correct word and let the child mark it */
function selfCheck(fbEl,w,cb){

    <div class="row" style="justify-content:center"><button class="btn primary big sYes">✔ All correct</button><button class="btn big sNo">✘ Not yet</button></div></div>`;
  say(w.w);
  fbEl.querySelector(".sYes").onclick=()=>cb(true);
  fbEl.querySelector(".sNo").onclick=()=>cb(false);
}

function tLcwc(st,task,w){
  let phase="look", wrongOnce=false;
  const r=S.res[w.id];
  const draw=()=>{
    if(phase==="look"){
      st.innerHTML=panes(`<div class="kind">Cover &amp; Write · Step 1: Look</div>
        ${grid(w.w,{id:"lk"})}${chunkRow(w.w,"lck")}`,
        `${sayBtns(w,{svg:"lk",sentence:false,sound:true})}
        <p class="muted" style="margin:0;font-size:18px">${wrongOnce?"Look closely at the letters you missed.":"Look at every letter. Spell it in your head."}</p>
        <div><button class="btn primary big" id="go">Cover it, I'll write</button></div>`);
      bindSay(st,w,"lk","lck"); bindChunks(st); $("#go").onclick=()=>{phase="write";draw();};
    }else{
      st.innerHTML=panes(`<div class="kind">Cover &amp; Write · Step 2: Write</div>
        <div class="cover">🙈 Covered</div>
        <div class="say"><button class="btn" data-s="n">🔊 Play</button></div>`,
        `<div id="ansBox" class="stack"></div><div id="fb"></div>`);
      bindSay(st,w);
      const done=ok=>{
        if(r.first===null&&S.mode==="lcwc")r.first=ok;
        if(ok){beep(true);$("#fb").innerHTML=`<div class="fb ok">Correct!</div>`;say(w.w);autoNext(1100);}
        else{beep(false);wrongOnce=true;phase="look";
          $("#fb").insertAdjacentHTML("beforeend",`<div style="margin-top:12px"><button class="btn primary big" id="again">Look again and rewrite</button></div>`);
          $("#again").onclick=draw;}
      };
      const A=answerArea($("#ansBox"),w,{submit:ans=>{
        if(ans===null){selfCheck($("#fb"),w,ok=>{if(!ok)$("#fb").innerHTML=`<div class="fb no">Let's look again.</div>`;done(ok);});return;}
        const ok=norm(ans)===norm(w.w); A.mark(ok);
        if(!ok)$("#fb").innerHTML=`<div class="fb no">${diffHtml(ans,w.w)}</div>`;
        done(ok);
      }});
    }
  };
  draw();
}

/* Dictation (with feedback) and Practice Test (marks at the end) */
function tDict(st,task,w){
  const r=S.res[w.id], mock=task.t==="mock";
  const n=S.tasks.filter(t=>t.t==="mock").length, cur=S.tasks.slice(0,S.i+1).filter(t=>t.t==="mock").length;
  st.innerHTML=panes(`<div class="kind">${mock?`Practice Test · ${cur} of ${n}`:"Dictation"}${task.retry?" · one more time":""}</div>
      <div class="headphones">🎧</div>
      ${sayBtns(w,{})}`,
    `<div id="ansBox" class="stack"></div><div id="fb"></div>`);
  bindSay(st,w);
  if(mock&&w.ex)say(w.w,{onend:()=>setTimeout(()=>say(w.ex,{onend:()=>setTimeout(()=>say(w.w),300)}),300)}); else say(w.w);
  let copying=false;
  const A=answerArea($("#ansBox"),w,{label:mock?"Next":"Check",placeholder:"Write what you hear",submit:ans=>{
    if(mock){ // no feedback during a test
      if(ans===null){selfCheck($("#fb"),w,ok=>{r.first=ok;r.ans=null;next();});return;}
      r.ans=ans; r.first=norm(ans)===norm(w.w); next(); return;
    }
    if(copying){
      const ok=ans===null||norm(ans)===norm(w.w);
      if(ok){beep(true);S.tasks.push({t:"dict",id:w.id,retry:true});next();}else{beep(false);A.mark(false);}
      return;
    }
    const finish=ok=>{
      r.tries++; if(r.first===null)r.first=ok;
      if(ok){beep(true);A.mark(true);$("#fb").innerHTML=`<div class="fb ok">Correct! <b style="font:28px var(--word)">${esc(w.w)}</b></div>`;say(w.w);autoNext(1100);return;}
      beep(false);say(w.w,{slow:true});
      const canRetry=r.tries<3;
      $("#fb").innerHTML=(ans!==null?`<div class="fb no">${diffHtml(ans,w.w)}</div>`:`<div class="fb no">The correct spelling: ${grid(w.w,{id:"cg"})}</div>`)+
        (canRetry?`<p class="muted">${method()==="write"?"Trace over the word once.":"Copy the correct spelling."} This word will come back later.</p>`:`<div style="margin-top:12px"><button class="btn primary big" id="go">Next</button></div>`);
      if(canRetry){copying=true;A.reset(method()==="write"?w.w:undefined);A.setLabel("I copied it");}
      else $("#go").onclick=next;
    };
    if(ans===null){selfCheck($("#fb"),w,finish);return;}
    A.mark(norm(ans)===norm(w.w));
    finish(norm(ans)===norm(w.w));
  }});
}

function tDone(st){
  clearInterval(timerH);
  const t=today(), now=Date.now(), ids=S.ids.filter(id=>B().words[id]), list=ids.map(id=>B().words[id]);
  const right=ids.filter(id=>S.res[id].first===true).length;
  const schedule=S.mode==="learn"||S.mode==="review";
  list.forEach(w=>{
    const ok=S.res[w.id].first===true;
    if(S.mode==="learn"){w.stage=Math.max(w.stage,1);w.due=addDays(t,INTERVAL[1]);w.learnedOn=t;if(!ok)w.lapses=(w.lapses||0)+1;}
    else if(S.mode==="review"){if(ok){w.stage=Math.min(w.stage+1,INTERVAL.length-1);w.due=addDays(t,INTERVAL[w.stage]);}else{w.stage=1;w.due=addDays(t,1);w.lapses=(w.lapses||0)+1;}}
    else if(S.res[w.id].first===false)w.lapses=(w.lapses||0)+1;
    if(S.res[w.id].first!==null){w.seen=(w.seen||0)+1;if(ok)w.right=(w.right||0)+1;}
    w.last=t; w.u=now;
  });
  const lg=B().log[t]||(B().log[t]={done:0,right:0});
  lg.done+=ids.length; lg.right+=right;
  let extra="";
  if(S.mode==="game"){
    const sec=Math.round((now-S.t0)/1000), acc=Math.round(S.hits/Math.max(1,S.hits+S.misses)*100);
    const rec=S.score>(B().best||0); if(rec)B().best=S.score;
    extra=`<div class="stat-row"><div class="stat"><b>${S.score}</b>Score</div><div class="stat"><b>${Math.floor(sec/60)}:${pad(sec%60)}</b>Time</div><div class="stat"><b>${acc}%</b>Accuracy</div></div>
      ${rec?`<div class="fb ok" style="font-size:20px">🏆 New best score!</div>`:`<div class="muted">Best score: ${B().best}</div>`}`;
  }
  if(S.mode==="mock"){
    const x=S.testId&&B().tests[S.testId];
    if(x){x.mocks=[...(x.mocks||[]),{d:t,s:right,n:ids.length,wrong:ids.filter(id=>S.res[id].first!==true)}].slice(-10);x.u=now;}
    extra=`<div class="stat-row"><div class="stat"><b>${right} / ${ids.length}</b>Marks</div><div class="stat"><b>${Math.round(right/Math.max(1,ids.length)*100)}%</b>Score</div></div>`;
  }
  Store.save();
  const ratio=right/Math.max(1,ids.length), stars=ratio>=.95?3:ratio>=.7?2:1;
  const wrongIds=ids.filter(id=>S.res[id].first!==true);
  st.innerHTML=`<div class="full"><div class="stars">${"★".repeat(stars)}<span style="opacity:.25">${"★".repeat(3-stars)}</span></div>
    <h2 style="font-size:34px">${stars===3?"Excellent!":stars===2?"Great job!":"Keep going, you're improving!"}</h2>
    <p class="muted" style="margin:0;font-size:18px">Right the first time: <b>${right}</b> of ${ids.length}${schedule?"":" · practice only"}</p>
    ${extra}
    <div class="card res-list"><div class="bank-list">${list.map(w=>{const rr=S.res[w.id],ok=rr.first===true;
      const dd=dayDiff(t,w.due);
      return `<div class="item"><span class="${ok?"ok-t":"no-t"}">${ok?"✔":"✘"}</span><div><span style="font:23px var(--word);color:var(--ink)">${esc(w.w)}</span>
        ${S.mode==="mock"&&!ok&&rr.ans?`<div class="diff" style="font-size:20px">${youWrote(rr.ans,w.w)}</div>`:""}</div>
      <span class="muted" style="font-size:13px">${schedule?(dd===1?"Review tomorrow":`Review in ${dd} days`):""}</span></div>`;}).join("")}</div></div>
    <div class="row" style="justify-content:center">
      ${S.mode==="game"?`<button class="btn sun big" id="again">Play again</button>`:""}
      ${wrongIds.length&&!schedule?`<button class="btn big" id="fix">Practise the ${wrongIds.length} I missed</button>`:""}
      <button class="btn primary big" id="fin">Finish</button></div></div>`;
  $("#fin").onclick=endSession;
  const ag=$("#again"); if(ag)ag.onclick=()=>startSession("game",S.ids);
  const fx=$("#fix"); if(fx)fx.onclick=()=>startSession("full",wrongIds);
  beep(true,true);
}

render();
(async()=>{
  const s=loadSession();
  if(!s)return;
  try{await Store.open(s.user,s.pass,false);if(tab==="login")tab="today";render();enrichAll();}
  catch(e){authErr=e.message==="bad_login"?"Please log in again.":authMsg(e);if(e.message==="bad_login")clearSession();render();}
})();
</script>
