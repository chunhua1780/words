<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>单词听写本 Word Speller</title>
<meta name="theme-color" content="#2742a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="单词听写本">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* 练习本风格：蓝色圆珠笔 + 红笔批改 + 英语四线三格；iPad 横屏双栏 */
:root{
  --bg:#eef2f8; --paper:#ffffff; --fg:#1d2433; --muted:#5d6a82; --soft:#e3e9f4;
  --ink:#2742a8; --on-ink:#ffffff; --ink-soft:#e4e9fb; --red:#d8342c; --red-soft:#fde8e6;
  --green:#1d8a4c; --green-soft:#e2f5ea; --sun:#f5b301; --sun-soft:#fff4d1; --line:#9fb3d6; --baseline:#e38d8d;
  --word:"Andika","Comic Sans MS",system-ui,sans-serif;
  --round:"Fredoka","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --body:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1422; --paper:#172036; --fg:#e6ebf5; --muted:#9aa6bf; --soft:#222d47;
  --ink:#8fa8ff; --on-ink:#0e1422; --ink-soft:#1f2b52; --red:#ff7b72; --red-soft:#3a1e22;
  --green:#5fd394; --green-soft:#143126; --sun:#ffc93c; --sun-soft:#3a3016; --line:#3d4f78; --baseline:#a55a5a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:env(safe-area-inset-top,0)}
.brand{font:600 22px/1.15 var(--round);color:var(--ink);display:flex;align-items:center;gap:10px}
.brand small{display:block;font:500 12px var(--round);color:var(--muted);letter-spacing:.04em}
.brand svg{width:34px;height:34px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;background:var(--paper);color:var(--muted);font-size:13px}
.spacer{flex:1}
.enl{font-size:.74em;font-weight:500;opacity:.78;font-family:var(--round)}
nav.tabs{display:flex;gap:6px;margin:14px 0 18px;background:var(--soft);padding:5px;border-radius:14px}
nav.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:10px;font-weight:700;color:var(--muted);line-height:1.25}
nav.tabs button .enl{display:block}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
h2{font:600 20px/1.3 var(--round);margin:0 0 6px;text-wrap:balance}
h3{font:600 17px/1.3 var(--round);margin:0 0 8px}
h2 .enl,h3 .enl{margin-left:6px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--paper);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:10px 18px;font-weight:700;background:var(--soft);color:var(--fg);line-height:1.25;min-height:48px}
.btn .enl{display:block}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.big{padding:12px 26px;font-size:18px;min-height:60px}
.btn.sun{background:var(--sun);color:#3a2a00}
.btn:disabled{opacity:.45;cursor:default}
.words{display:flex;flex-wrap:wrap;gap:6px}
.w{font:18px var(--word);background:var(--ink-soft);color:var(--ink);padding:2px 10px;border-radius:8px}
.w small{font:12px var(--body);color:var(--muted);margin-left:4px}
.date{font:600 30px/1.1 var(--round)}
.grid-home{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){.grid-home{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid-home{grid-template-columns:1fr}}
.big-num{font:600 36px/1 var(--round);color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;counter-reset:s}
@media (max-width:700px){.steps{grid-template-columns:1fr 1fr}}
.step{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.step b{display:block;font:600 16px var(--round);color:var(--fg)}
.step b::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:12px;margin-right:6px;vertical-align:2px}
.forecast{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px}
.forecast .bar{height:54px;display:flex;align-items:flex-end;justify-content:center}
.forecast .bar i{display:block;width:60%;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.forecast .n{font:600 13px var(--round);font-variant-numeric:tabular-nums}
textarea,input[type=text]{width:100%;border:2px solid var(--soft);background:var(--paper);color:var(--fg);border-radius:12px;padding:10px 12px;font:18px/1.5 var(--word)}
textarea{min-height:220px;resize:vertical}
label.opt{display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:12px;background:var(--soft);cursor:pointer;min-height:44px}
label.opt:has(input:checked){background:var(--ink-soft);color:var(--ink);font-weight:700}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:800px){.add-grid{grid-template-columns:1fr}}
.pv-table{width:100%;border-collapse:collapse;font-size:15px}
.pv-table td,.pv-table th{padding:6px 8px;border-bottom:1px solid var(--soft);text-align:left}
.pv-table th{font-size:12px;color:var(--muted);font-weight:600}
.pv-table .e{font:18px var(--word);color:var(--ink)}
.pv-table .auto{color:var(--muted);font-style:italic}
.list{display:flex;flex-direction:column}
.bank-list{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
@media (max-width:800px){.bank-list{grid-template-columns:1fr}}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}
.item .en{font:21px var(--word);color:var(--ink)}
.item .cn{min-width:0}
.item .cn input{font:15px var(--body);padding:4px 8px;border-width:1px}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--soft)}
.dots i.on{background:var(--green)}
.icon-btn{border:0;background:var(--soft);border-radius:12px;min-width:44px;height:44px;display:inline-grid;place-items:center;font-size:18px;padding:0 8px}
.del.confirm{background:var(--red);color:#fff;font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.filters button,.seg button{border:0;border-radius:999px;padding:6px 14px;background:var(--soft);font-size:14px;min-height:40px}
.filters button.on,.seg button.on{background:var(--ink);color:var(--on-ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.notice{padding:10px 12px;border-radius:10px;background:var(--ink-soft);color:var(--ink);font-size:14px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:800px){.modes{grid-template-columns:1fr 1fr}}
.mode{border:0;text-align:left;background:var(--paper);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-height:140px;border:2px solid transparent}
.mode:hover{border-color:var(--ink-soft)}
.mode .ic{font-size:30px;line-height:1}
.mode b{font:600 19px var(--round)}
.mode .enl{display:block;color:var(--ink)}
.mode span.d{font-size:13px;color:var(--muted)}
.mode.game{background:var(--sun-soft)}

/* ===== 学习界面 Session ===== */
#session{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.s-top{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left));max-width:1180px;width:100%;margin:0 auto}
.s-label{font:600 16px/1.2 var(--round);color:var(--ink);white-space:nowrap}
.s-label .enl{display:block}
.prog{flex:1;height:12px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.hud{display:flex;gap:8px;font:600 15px var(--round);font-variant-numeric:tabular-nums}
.hud span{background:var(--paper);border-radius:10px;padding:4px 10px;white-space:nowrap}
.hud .combo{background:var(--sun);color:#3a2a00}
.s-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.stage{max-width:640px;margin:0 auto;padding:10px 16px 30px;display:flex;flex-direction:column;gap:16px;text-align:center}
.pa,.pb,.full{display:flex;flex-direction:column;gap:14px;min-width:0}
.pa{container-type:inline-size}
@media (min-width:880px) and (orientation:landscape){
  .stage{max-width:1180px;display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:start;padding:18px 28px 30px}
  .stage > .full{grid-column:1/-1;max-width:760px;margin:0 auto;width:100%}
  .pa{position:sticky;top:0;background:var(--paper);border-radius:22px;padding:22px}
  .pb{padding-top:6px}
}
.kind{font:600 14px var(--round);letter-spacing:.06em;color:var(--muted)}
.grid4{display:block;width:100%;--h:min(40px,7.5vh,calc(100cqw / (var(--n) * 1.12)));height:calc(var(--h) * 3 + 2px);overflow:visible}
.grid4 line{stroke:var(--line);stroke-width:1}
.grid4 line.base{stroke:var(--baseline);stroke-width:1.5}
.grid4 text{font-family:var(--word);font-size:calc(var(--h) * 2);fill:var(--fg)}
.grid4 .s1{fill:var(--ink)} .grid4 .s2{fill:var(--red)}
.grid4 .hl{fill:var(--sun)}
.meaning{font-size:26px;font-weight:700}
.meaning.huge{font-size:40px;padding:12px 0}
.ipa{font:17px var(--word);color:var(--muted)}
.ex{background:var(--bg);border-radius:12px;padding:10px 14px;text-align:left}
.ex .e{font:18px var(--word)}
.tip{background:var(--green-soft);color:var(--green);border-radius:12px;padding:8px 14px;text-align:left;font-size:14px}
.say{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.say .btn{min-width:92px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt-btn{border:2px solid var(--soft);background:var(--paper);border-radius:16px;padding:16px 10px;font-size:20px;font-weight:700;min-height:76px}
.opt-btn.en{font:24px var(--word)}
.opt-btn.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:44px;height:54px;border-bottom:3px solid var(--line);font:32px/52px var(--word);color:var(--green)}
.slot.given{color:var(--muted)}
.slot.next{border-bottom-color:var(--ink)}
.slot.gap{border:0;width:16px}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:60px;height:64px;border:0;border-radius:14px;background:var(--paper);font:32px var(--word);color:var(--ink);box-shadow:0 4px 0 var(--soft)}
@media (min-width:880px) and (orientation:landscape){.tile{width:68px;height:72px;font-size:36px}}
.tile.used{visibility:hidden}
.tile.bad{animation:shake .35s;background:var(--red-soft);color:var(--red)}
.tile.hint{outline:3px dashed var(--sun)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .3s}
@media (prefers-reduced-motion:reduce){.tile.bad,.pop{animation:none}.prog i{transition:none}}
.answer{font:30px var(--word);text-align:center;letter-spacing:.04em;padding:12px}
.answer.ok{border-color:var(--green)} .answer.no{border-color:var(--red)}
.fb{border-radius:12px;padding:12px;font-size:16px}
.fb.ok{background:var(--green-soft);color:var(--green)}
.fb.no{background:var(--red-soft);color:var(--red)}
.diff{font:28px var(--word);letter-spacing:.04em}
.diff .x{color:var(--red);text-decoration:line-through}
.diff .m{color:var(--red);background:var(--red-soft);border-radius:4px}
.diff .k{color:var(--green)}
.cover{height:120px;border-radius:12px;background:repeating-linear-gradient(45deg,var(--soft) 0 12px,var(--paper) 12px 24px);display:grid;place-items:center;color:var(--muted);font-weight:700}
.headphones{font-size:72px;line-height:1}
.stars{font-size:44px;letter-spacing:4px;color:var(--sun)}
.res-list{text-align:left}
.ok-t{color:var(--green);font-weight:700} .no-t{color:var(--red);font-weight:700}
.stat-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stat{background:var(--paper);border-radius:14px;padding:10px 18px;min-width:110px}
.stat b{display:block;font:600 28px var(--round);color:var(--ink);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="3" width="24" height="26" rx="4" fill="var(--ink)"/><g stroke="var(--paper)" stroke-width="1.4" opacity=".9"><line x1="8" y1="11" x2="24" y2="11"/><line x1="8" y1="15" x2="24" y2="15"/><line x1="8" y1="19" x2="24" y2="19"/><line x1="8" y1="23" x2="24" y2="23"/></g><path d="M9 20.5l3-6 3 6M10 18.8h4" stroke="var(--sun)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <div>单词听写本<small>Word Speller</small></div>
    </div>
    <span class="spacer"></span>
    <span class="chip" id="streak"></span>
    <span class="chip" id="total"></span>
    <button class="chip" id="accent" style="border:0" title="发音 Accent"></button>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today">今天<span class="enl">Today</span></button>
    <button role="tab" data-tab="practice">练习<span class="enl">Practice</span></button>
    <button role="tab" data-tab="tomorrow">明天<span class="enl">Tomorrow</span></button>
    <button role="tab" data-tab="add">添加单词<span class="enl">Add Words</span></button>
    <button role="tab" data-tab="bank">词库<span class="enl">Word Bank</span></button>
  </nav>
  <main id="view"></main>
</div>

<section id="session" hidden>
  <div class="s-top">
    <button class="icon-btn" id="quit" aria-label="退出 Quit">✕</button>
    <span class="s-label" id="sLabel"></span>
    <div class="prog"><i id="sProg"></i></div>
    <div class="hud" id="hud" hidden><span id="hScore"></span><span class="combo" id="hCombo" hidden></span><span id="hTime"></span></div>
  </div>
  <div class="s-body"><div class="stage" id="stage"></div></div>
</section>

<script>
"use strict";
/* ---------------- 内置小词典 Built-in mini dictionary ---------------- */
const DICT_RAW = "apple|苹果 n.;banana|香蕉 n.;orange|橙子 n.;pear|梨 n.;grape|葡萄 n.;peach|桃子 n.;watermelon|西瓜 n.;strawberry|草莓 n.;lemon|柠檬 n.;fruit|水果 n.;cat|猫 n.;dog|狗 n.;bird|鸟 n.;fish|鱼 n.;rabbit|兔子 n.;tiger|老虎 n.;lion|狮子 n.;monkey|猴子 n.;panda|熊猫 n.;elephant|大象 n.;horse|马 n.;cow|奶牛 n.;pig|猪 n.;duck|鸭子 n.;chicken|鸡；鸡肉 n.;sheep|绵羊 n.;mouse|老鼠 n.;bear|熊 n.;zoo|动物园 n.;animal|动物 n.;red|红色 adj.;blue|蓝色 adj.;green|绿色 adj.;yellow|黄色 adj.;black|黑色 adj.;white|白色 adj.;pink|粉色 adj.;purple|紫色 adj.;brown|棕色 adj.;color|颜色 n.;one|一;two|二;three|三;four|四;five|五;six|六;seven|七;eight|八;nine|九;ten|十;eleven|十一;twelve|十二;twenty|二十;hundred|百;book|书 n.;pen|钢笔 n.;pencil|铅笔 n.;ruler|尺子 n.;eraser|橡皮 n.;bag|包 n.;desk|课桌 n.;chair|椅子 n.;school|学校 n.;teacher|老师 n.;student|学生 n.;classroom|教室 n.;friend|朋友 n.;family|家庭 n.;father|父亲 n.;mother|母亲 n.;brother|兄弟 n.;sister|姐妹 n.;grandpa|爷爷；外公 n.;grandma|奶奶；外婆 n.;baby|婴儿 n.;boy|男孩 n.;girl|女孩 n.;man|男人 n.;woman|女人 n.;head|头 n.;face|脸 n.;eye|眼睛 n.;ear|耳朵 n.;nose|鼻子 n.;mouth|嘴 n.;hand|手 n.;arm|胳膊 n.;leg|腿 n.;foot|脚 n.;hair|头发 n.;body|身体 n.;big|大的 adj.;small|小的 adj.;long|长的 adj.;short|短的；矮的 adj.;tall|高的 adj.;fat|胖的 adj.;thin|瘦的 adj.;happy|开心的 adj.;sad|难过的 adj.;hot|热的 adj.;cold|冷的 adj.;warm|温暖的 adj.;cool|凉爽的 adj.;good|好的 adj.;bad|坏的 adj.;new|新的 adj.;old|旧的；老的 adj.;beautiful|美丽的 adj.;hungry|饿的 adj.;thirsty|渴的 adj.;tired|累的 adj.;water|水 n.;milk|牛奶 n.;juice|果汁 n.;bread|面包 n.;rice|米饭 n.;egg|鸡蛋 n.;cake|蛋糕 n.;noodles|面条 n.;meat|肉 n.;breakfast|早餐 n.;lunch|午餐 n.;dinner|晚餐 n.;food|食物 n.;sun|太阳 n.;moon|月亮 n.;star|星星 n.;sky|天空 n.;cloud|云 n.;rain|雨 n.;snow|雪 n.;wind|风 n.;weather|天气 n.;tree|树 n.;flower|花 n.;grass|草 n.;river|河 n.;mountain|山 n.;house|房子 n.;home|家 n.;room|房间 n.;door|门 n.;window|窗户 n.;bed|床 n.;table|桌子 n.;kitchen|厨房 n.;car|小汽车 n.;bus|公共汽车 n.;bike|自行车 n.;train|火车 n.;plane|飞机 n.;boat|小船 n.;run|跑 v.;jump|跳 v.;swim|游泳 v.;fly|飞 v.;walk|走 v.;sing|唱歌 v.;dance|跳舞 v.;read|读 v.;write|写 v.;draw|画画 v.;play|玩 v.;eat|吃 v.;drink|喝 v.;sleep|睡觉 v.;look|看 v.;see|看见 v.;listen|听 v.;speak|说 v.;open|打开 v.;close|关上 v.;like|喜欢 v.;love|爱 v.;want|想要 v.;have|有 v.;go|去 v.;come|来 v.;help|帮助 v.;clean|打扫；干净的;wash|洗 v.;cook|做饭 v.;Monday|星期一 n.;Tuesday|星期二 n.;Wednesday|星期三 n.;Thursday|星期四 n.;Friday|星期五 n.;Saturday|星期六 n.;Sunday|星期日 n.;day|天 n.;week|星期 n.;month|月 n.;year|年 n.;today|今天 n.;tomorrow|明天 n.;morning|早上 n.;afternoon|下午 n.;evening|晚上 n.;night|夜晚 n.;time|时间 n.;spring|春天 n.;summer|夏天 n.;autumn|秋天 n.;winter|冬天 n.;hello|你好;goodbye|再见;thanks|谢谢;please|请;sorry|对不起;yes|是;no|不;ball|球 n.;toy|玩具 n.;doll|娃娃 n.;kite|风筝 n.;music|音乐 n.;English|英语 n.;Chinese|中文 n.;math|数学 n.;art|美术 n.;science|科学 n.;doctor|医生 n.;nurse|护士 n.;farmer|农民 n.;driver|司机 n.;park|公园 n.;shop|商店 n.;hospital|医院 n.;library|图书馆 n.;city|城市 n.;country|国家 n.;world|世界 n.";
const DICT = {};
DICT_RAW.split(";").forEach(p=>{const [w,c]=p.split("|"); DICT[w.toLowerCase()]=c;});

/* ---------------- 工具 Utils ---------------- */
const $=s=>document.querySelector(s);

let voice=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const want=state.accent==="uk"?/en[-_]GB/i:/en[-_]US/i;
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const pref=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Daniel","Karen","Alex"];
  voice=vs.find(v=>want.test(v.lang)&&pref.some(n=>v.name.includes(n)))||vs.find(v=>want.test(v.lang))||vs[0]||null;
}
if("speechSynthesis" in window){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
let speakId=0;
function stopAudio(){speakId++;try{player.pause();}catch(e){} if("speechSynthesis" in window)speechSynthesis.cancel();}
/* 设备语音 Device voice (TTS) */
function tts(text,{rate=.85,lang="en-US",onend}={}){
  const id=++speakId;
  let fired=false; const fire=()=>{if(!fired&&id===speakId){fired=true;onend&&onend();}};
  try{player.pause();}catch(e){}
  if(!("speechSynthesis" in window)){setTimeout(fire,300);return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=rate;
  if(lang.startsWith("en")&&voice)u.voice=voice;
  u.onend=fire; u.onerror=fire;
  speechSynthesis.speak(u);
  if(onend)setTimeout(fire,1500+text.length*180/rate);
}
/* 联网发音 Online audio */
function onlineUrl(text,zh){
  if(zh)return "https://dict.youdao.com/dictvoice?le=zh&audio="+encodeURIComponent(text);
  return "https://dict.youdao.com/dictvoice?type="+(state.accent==="uk"?1:2)+"&audio="+encodeURIComponent(text);
}
function say(text,{slow=false,onend,zh=false}={}){
  if(!text)return;
  if(!navigator.onLine){tts(text,{rate:slow?.45:.85,lang:zh?"zh-CN":(state.accent==="uk"?"en-GB":"en-US"),onend});return;}
  if("speechSynthesis" in window)speechSynthesis.cancel();
  const id=++speakId;
  let fired=false; const fire=()=>{if(!fired&&id===speakId){fired=true;onend&&onend();}};
  let fell=false; const fallback=()=>{if(fell||id!==speakId)return;fell=true;
    const w=!zh&&findWord(text); // 再试词典发音，最后用设备语音
    if(w&&w.audio&&player.src!==w.audio){fell=false;player.src=w.audio;player.play().catch(()=>{fell=false;fallback2();});return;}
    fallback2();};
  const fallback2=()=>{if(id!==speakId)return;fell=true;tts(text,{rate:slow?.45:.85,lang:zh?"zh-CN":(state.accent==="uk"?"en-GB":"en-US"),onend});};
  player.onended=fire; player.onerror=()=>fallback();
  player.src=onlineUrl(text,zh);
  try{player.playbackRate=slow?.6:1; player.defaultPlaybackRate=slow?.6:1; player.preservesPitch=true;}catch(e){}
  player.play().catch(()=>fallback());
  if(onend)setTimeout(()=>{if(!fell)fire();},(slow?7000:4500));
}
function sayZh(text){say(text.replace(/\b(n|v|vt|vi|adj|adv|prep|pron|conj|num|art|int)\./g,"").trim(),{zh:true});}

/* 逐个字母拼读 Spell letter by letter, highlighting the grid */
function spellOut(w,svgSel){
  const letters=[...w]; let i=0;
  const step=()=>{
    document.querySelectorAll(svgSel+" tspan").forEach(t=>t.classList.remove("hl"));
    if(i>=letters.length){say(w);return;}
    const t=document.querySelector(`${svgSel} tspan[data-i="${i}"]`); if(!t)return; t.classList.add("hl");
    const ch=letters[i++];
    if(!/[a-z]/i.test(ch)){setTimeout(step,250);return;}
    tts(ch.toUpperCase(),{rate:.8,onend:()=>setTimeout(step,120)});
  };
  step();
}

/* ---------------- 音效 Sound effects ---------------- */
let actx=null;
function beep(ok,big){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?(big?[523,659,784,1047]:[660,880]):[220,180];
    notes.forEach((f,k)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type=ok?"sine":"square";
      const t0=actx.currentTime+k*.1;
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(ok?.16:.05,t0+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t0+.15);o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+.18);});
  }catch(e){}
}

/* ---------------- 四线三格 Four-line grid ---------------- */
function grid(word,{syl,id="g"}={}){
  const n=Math.max(word.length,5);
  let spans="", i=0;
  const parts=syl&&syl.replace(/[·\-]/g,"").toLowerCase()===word.toLowerCase()?syl.split(/[·\-]/):[word];
  parts.forEach((p,k)=>{for(const ch of p){
    const cls=parts.length>1?(k%2?"s2":"s1"):"";
    spans+=`<tspan data-i="${i}" class="${cls}">${esc(ch===" "?"\u00a0":ch)}</tspan>`; i++;}});
  return `<svg class="grid4" id="${id}" style="--n:${n}" aria-label="${esc(word)}">
    <line x1="0" x2="100%" y1="1" y2="1"/><line x1="0" x2="100%" y1="33.33%" y2="33.33%"/>
    <line class="base" x1="0" x2="100%" y1="66.67%" y2="66.67%"/><line x1="0" x2="100%" y1="99%" y2="99%"/>
    <text x="50%" y="66.67%" text-anchor="middle">${spans}</text></svg>`;
}

/* ---------------- 中英文输入解析 Parse mixed Chinese/English input ---------------- */
const POS_RE=/(^|[\s\u3400-\u9fff,，;；])((?:n|v|vt|vi|adj|adv|prep|pron|conj|num|art|int)\.)(?=$|[\s\u3400-\u9fff,，;；])/g;
function parseLine(line){
  let pos=[]; line=line.replace(POS_RE,(m,a,p)=>{pos.push(p);return a+" ";});
  const runs=line.match(/[A-Za-z][A-Za-z'’\- .]*[A-Za-z]|[A-Za-z]/g); if(!runs)return null;
  const en=runs.sort((a,b)=>b.length-a.length)[0];
  let w=en.replace(/[\s.\-]+$/,"").replace(/\s+/g," ").trim();
  let cn=line.replace(en,"").replace(/[\s,，:：\-—=|\/、。.;；\t]+/g," ").trim();
  if(!hasCJK(cn))cn="";
  if(cn&&pos.length)cn+=" "+pos.join(" ");
  return w?{w,cn}:null;
}
function parseInput(text){
  const out=[];
  text.split(/\n/).forEach(line=>{
    line=line.trim(); if(!line)return;
    if(!hasCJK(line)){line.split(/[,，、;；]/).forEach(c=>{const r=parseLine(c);if(r)out.push(r);});return;}
    // 一行里有多组「英文+中文」用分号隔开
    line.split(/[;；]/).forEach(c=>{const r=parseLine(c);if(r)out.push(r);});
  });
  return out;
}
async function fetchJSON(url,ms=6000){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(url,{signal:ctl.signal}); if(!r.ok)return null; return await r.json();}catch(e){return null;}finally{clearTimeout(t);}
}
/* 联网补全 Online lookup: 中文 (MyMemory)、音标/例句/发音 (Free Dictionary) */
async function enrich(word){
  const jobs=[];
  if(!word.cn){
    jobs.push(fetchJSON("https://api.mymemory.translated.net/get?langpair=en|zh-CN&q="+encodeURIComponent(word.w)).then(j=>{
      const t=j&&j.responseData&&j.responseData.translatedText;
      if(t&&hasCJK(t)&&!word.cn)word.cn=t.replace(/[。.]$/,"");
    }));
  }
  if(!word.ipa||!word.ex||!word.audio){
    jobs.push(fetchJSON("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word.w.toLowerCase())).then(j=>{
      if(!Array.isArray(j))return;
      const e=j[0]; const phs=e.phonetics||[];
      const ph=e.phonetic||phs.map(p=>p.text).find(Boolean);
      if(ph&&!word.ipa)word.ipa=ph.startsWith("/")?ph:"/"+ph+"/";
      const au=phs.find(p=>p.audio&&/-us\./.test(p.audio))||phs.find(p=>p.audio);
      if(au&&!word.audio)word.audio=au.audio;
      if(!word.ex){
        for(const m of e.meanings||[])for(const d of m.definitions||[])
          if(d.example&&d.example.split(" ").length<=12&&new RegExp("\\b"+word.w.split(" ")[0],"i").test(d.example)){word.ex=d.example;return;}
      }
    }));
  }
  await Promise.all(jobs);
}

/* ---------------- 列表 Lists ---------------- */
function dueOn(day){
  const ws=words(), isToday=day===today();
  const fresh=ws.filter(w=>w.stage===0&&(isToday?w.due<=day:w.due===day));
  const review=ws.filter(w=>w.stage>0&&(isToday?w.due<=day:w.due===day));
  return {fresh,review};
}
function streak(){
  let n=0,d=today();
  if(!state.log[d])d=addDays(d,-1);
  while(state.log[d]){n++;d=addDays(d,-1);}
  return n;
}

  today:{zh:"今天的词",en:"Today",get:()=>{const t=today(),d=dueOn(t);const s=new Set([...d.fresh,...d.review,...words().filter(w=>w.learnedOn===t)]);return [...s];}},
  tomorrow:{zh:"明天的词",en:"Tomorrow",get:()=>{const d=dueOn(addDays(today(),1));return [...d.fresh,...d.review];}},
  hard:{zh:"易错词",en:"Mistakes",get:()=>words().filter(w=>(w.lapses||0)>0)},
  recent:{zh:"最近 3 天",en:"Last 3 days",get:()=>{const t=today();return words().filter(w=>w.added&&dayDiff(w.added,t)<=2);}},
  all:{zh:"全部",en:"All",get:()=>words()},
};

async function addWords(){

  if(!items.length){addMsg="没有找到英文单词。No English words found. 例如 e.g. apple 苹果";render();return;}
  const due=addTarget==="tomorrow"?addDays(today(),1):today();
  let added=[],dup=[];
  items.forEach(({w,cn})=>{
    const old=findWord(w);
    if(old){ if(cn)old.cn=cn; if(old.stage===0)old.due=due; dup.push(w); return;}
    const id=uid();
    state.words[id]={id,w,cn:cn||DICT[w.toLowerCase()]||"",ipa:"",ex:"",stage:0,due,added:today(),lapses:0};
    added.push(state.words[id]);
  });
  save();
  btn.disabled=true; btn.innerHTML=L("正在联网查询…","Looking up online…");
  await Promise.all(added.map(enrich));
  save();
  const miss=added.filter(w=>!w.cn).length;

  addMsg=`已添加 ${added.length} 个新词到${where}的列表。Added ${added.length} words.`+(dup.length?` 已在词库 Already saved: ${dup.map(esc).join(", ")}。`:"")+(miss?` ${miss} 个词没查到中文，请在下面补上。Please add Chinese below.`:"");
  addDraft="";
  render();
}

let S=null, timerH=null;
const MODE_NAME={learn:["学新词","New Words"],review:["复习","Review"],full:["完整五步","Full 5 Steps"],dict:["听写","Dictation"],mx:["默写","Write from Memory"],game:["拼写游戏","Spelling Game"]};
function fullTasks(ids,tasks){
  const groups=[]; for(let i=0;i<ids.length;i+=5)groups.push(ids.slice(i,i+5));
  groups.forEach((g,k)=>{
    tasks.push({t:"intro",zh:groups.length>1?`第 ${k+1} 组（共 ${groups.length} 组）`:`${g.length} 个新词`,en:groups.length>1?`Group ${k+1} of ${groups.length}`:`${g.length} new words`,sub:"先看一看、听一听，再认、拼、默写。Look and listen first, then match, build and write.",ids:g});
    g.forEach(id=>tasks.push({t:"preview",id}));
    shuffle(g).forEach(id=>tasks.push({t:"recog",id}));
    shuffle(g).forEach(id=>tasks.push({t:"tiles",id}));
    shuffle(g).forEach(id=>tasks.push({t:"lcwc",id}));
  });
  tasks.push({t:"intro",zh:"最后：全部听写",en:"Final dictation",sub:`听发音写出单词，一共 ${ids.length} 个，写错的会再考一次。Listen and write all ${ids.length} words. Mistakes come back once more.`});
  shuffle(ids).forEach(id=>tasks.push({t:"dict",id}));
}
function startSession(mode,ids){
  ids=ids.filter(id=>state.words[id]); if(!ids.length)return;
  const tasks=[], n=ids.length;
  if(mode==="learn"||mode==="full")fullTasks(ids,tasks);
  else if(mode==="review"){
    tasks.push({t:"intro",zh:`复习 ${n} 个词`,en:`Review ${n} words`,sub:"先认一认，再听写。写错的词会再看一遍、再写一遍。Match first, then dictation. Mistakes get another look."});
    shuffle(ids).forEach(id=>tasks.push({t:"recog",id}));
    shuffle(ids).forEach(id=>tasks.push({t:"dict",id}));
  }else if(mode==="dict"){
    tasks.push({t:"intro",zh:`听写 ${n} 个词`,en:`Dictation · ${n} words`,sub:"听发音写出单词，按回车或「检查」提交。Listen, type, then press Enter or Check."});
    shuffle(ids).forEach(id=>tasks.push({t:"dict",id}));
  }else if(mode==="mx"){
    tasks.push({t:"intro",zh:`默写 ${n} 个词`,en:`Write from memory · ${n} words`,sub:"看中文写英文。想不起来可以点「听一听」或「首字母」提示。See the Chinese, write the English. Use a hint if you're stuck."});
    shuffle(ids).forEach(id=>tasks.push({t:"mx",id}));
  }else if(mode==="game"){
    tasks.push({t:"intro",zh:`拼写游戏 · ${n} 个词`,en:`Spelling Game · ${n} words`,sub:"听发音、看中文，按顺序点字母。连对有连击加分，点错会扣分。越快越好！Tap letters in order. Streaks earn bonus points, wrong taps cost points. Be quick!",game:true});
    shuffle(ids).forEach(id=>tasks.push({t:"game",id,kind:Math.random()<.5?"build":"gap"}));
  }
  S={mode,ids,tasks,i:0,res:Object.fromEntries(ids.map(id=>[id,{first:null,tries:0}])),score:0,combo:0,hits:0,misses:0,t0:0};
  $("#hud").hidden=mode!=="game";
  $("#session").hidden=false; document.body.style.overflow="hidden";
  renderTask();
}
function endSession(){S=null;clearInterval(timerH);$("#session").hidden=true;document.body.style.overflow="";stopAudio();render();}
$("#quit").onclick=()=>{
  const b=$("#quit");
  if(!S||S.tasks[S.i]?.t==="done"){endSession();return;}
  if(!b.classList.contains("confirm")){b.classList.add("confirm","del");b.textContent="退出? Quit?";setTimeout(()=>{b.classList.remove("confirm","del");b.textContent="✕";},2500);return;}
  b.classList.remove("confirm","del");b.textContent="✕";endSession();
};

function distractors(w,field,n){
  const pool=new Set();
  S.ids.forEach(id=>{const x=state.words[id]; if(x.id!==w.id&&x[field])pool.add(x[field]);});
  words().forEach(x=>{if(pool.size<n*4&&x.id!==w.id&&x[field])pool.add(x[field]);});
  if(pool.size<n)shuffle(Object.entries(DICT)).slice(0,20).forEach(([en,cn])=>pool.add(field==="w"?en:cn));
  pool.delete(w[field]);
  return shuffle([...pool]).slice(0,n);
}

/* 字母块通用逻辑 Letter tiles (used by Build and the Spelling Game) */
function letterBoard(st,w,{blanks,extra=0,onHit,onMiss,onDone,hintAfter=3}){
  const letters=[...w.w];
  const need=blanks.slice(); // 要填的位置（按顺序）
  const pool=need.map(i=>letters[i]);
  const abc="abcdefghijklmnopqrstuvwxyz".split("").filter(c=>!letters.map(x=>x.toLowerCase()).includes(c));
  for(let k=0;k<extra;k++)pool.push(abc[Math.random()*abc.length|0]);
  const tiles=shuffle(pool.map((c,k)=>({c,k})));
  let pos=0, miss=0; const filled=new Set();
  const slotsHtml=()=>letters.map((c,i)=>c===" "?`<span class="slot gap"></span>`:
    need.includes(i)?`<span class="slot ${filled.has(i)?"":i===need[pos]?"next":""}">${filled.has(i)?esc(c):""}</span>`:`<span class="slot given">${esc(c)}</span>`).join("");
  $("#slots").innerHTML=slotsHtml();
  $("#tiles").innerHTML=tiles.map((t,k)=>`<button class="tile" data-k="${k}">${esc(t.c)}</button>`).join("");
  const tap=b=>{
    if(pos>=need.length||b.classList.contains("used"))return;
    const t=tiles[b.dataset.k], want=letters[need[pos]];
    if(t.c.toLowerCase()===want.toLowerCase()){
      b.classList.add("used"); filled.add(need[pos]); pos++; $("#slots").innerHTML=slotsHtml();
      st.querySelectorAll(".tile.hint").forEach(x=>x.classList.remove("hint"));
      onHit&&onHit();
      if(pos===need.length){document.removeEventListener("keydown",kb);onDone(miss);}
    }else{
      miss++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad");
      onMiss&&onMiss();
      if(miss>=hintAfter){const h=[...st.querySelectorAll(".tile:not(.used)")].find(x=>tiles[x.dataset.k].c.toLowerCase()===letters[need[pos]].toLowerCase()); if(h)h.classList.add("hint");}
    }
  };
  st.querySelectorAll(".tile").forEach(b=>b.onclick=()=>tap(b));
  // 实体键盘也能玩 Physical keyboard support
  const kb=e=>{if(!S||!document.body.contains(st))return; if(e.key.length!==1||!/[a-z'\-]/i.test(e.key))return;
    const cand=[...st.querySelectorAll(".tile:not(.used)")];
    const b=cand.find(x=>tiles[x.dataset.k].c.toLowerCase()===e.key.toLowerCase()&&e.key.toLowerCase()===letters[need[pos]].toLowerCase())||cand.find(x=>tiles[x.dataset.k].c.toLowerCase()===e.key.toLowerCase())||cand[0];
    if(b)tap(b);};
  document.removeEventListener("keydown",window.__kb||(()=>{})); window.__kb=kb; document.addEventListener("keydown",kb);
}

function tGame(st,task,w){
  const idx=[...w.w].map((c,i)=>c===" "?-1:i).filter(i=>i>=0);
  let blanks=idx;
  if(task.kind==="gap"&&idx.length>=3){const k=Math.min(idx.length-1,Math.max(2,Math.round(idx.length*.5)));blanks=shuffle(idx).slice(0,k).sort((a,b)=>a-b);}
  const n=S.tasks.filter(t=>t.t==="game").length, cur=S.tasks.slice(0,S.i+1).filter(t=>t.t==="game").length;
  st.innerHTML=panes(`<div class="kind">第 ${cur} / ${n} 个 · Word ${cur} of ${n} · ${blanks.length===idx.length?"拼出整个单词 <span class='enl'>Spell the whole word</span>":"补全缺的字母 <span class='enl'>Fill the missing letters</span>"}</div>
    <div class="meaning huge">${esc(w.cn||"🎧")}</div>
    <div class="say"><button class="btn" data-s="n">${L("🔊 读","Play")}</button><button class="btn" data-s="slow">${L("🐢 慢读","Slow")}</button></div>`,
    `<div class="slots" id="slots"></div><div class="tiles" id="tiles"></div><div id="fb" class="small muted">每个字母 +10，连击再加分；点错 −3。Each letter +10, streak bonus; wrong tap −3.</div>`);
  bindSay(st,w); setTimeout(()=>say(w.w),150);
  letterBoard(st,w,{blanks,extra:2,hintAfter:3,
    onHit:()=>{S.hits++;S.combo++;S.score+=10+Math.min(S.combo,10)*2;beep(true);updHud();$("#hScore").classList.remove("pop");void $("#hScore").offsetWidth;$("#hScore").classList.add("pop");},
    onMiss:()=>{S.misses++;S.combo=0;S.score=Math.max(0,S.score-3);updHud();if(S.res[w.id].first===null)S.res[w.id].first=false;},
    onDone:miss=>{
      if(S.res[w.id].first===null)S.res[w.id].first=true;
      const bonus=miss?0:20; S.score+=bonus; updHud();
      $("#fb").innerHTML=`<span class="ok-t" style="font-size:18px">${miss?"完成 Done":"完美 Perfect! +20"}</span>`;
      beep(true,!miss); say(w.w); const i0=S.i; setTimeout(()=>{if(S&&S.i===i0)next();},1100);
    }});
}

function lcsMask(ans,cor){
  const a=[...norm(ans)],c=[...cor.toLowerCase()],m=a.length,n=c.length;
  const dp=[...Array(m+1)].map(()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=a[i]===c[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const keepA=Array(m).fill(false),keepC=Array(n).fill(false);let i=0,j=0;
  while(i<m&&j<n){if(a[i]===c[j]){keepA[i]=keepC[j]=true;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
  return {keepA,keepC};
}
function diffHtml(ans,cor){
  const {keepA,keepC}=lcsMask(ans,cor);
  const a=[...norm(ans)].map((ch,i)=>keepA[i]?`<span class="k">${esc(ch)}</span>`:`<span class="x">${esc(ch)}</span>`).join("")||"<span class='muted'>（空 empty）</span>";
  const c=[...cor].map((ch,i)=>keepC[i]?esc(ch):`<span class="m">${esc(ch)}</span>`).join("");
  return `<div class="muted small">你写的 You wrote</div><div class="diff">${a}</div><div class="muted small" style="margin-top:6px">正确的 Correct（红色 = 写错或漏掉 red = wrong or missing）</div><div class="diff" style="color:var(--fg)">${c}</div>`;
}

function tLcwc(st,task,w){
  let phase="look", wrongOnce=false;
  const draw=()=>{
    if(phase==="look"){
      st.innerHTML=panes(`<div class="kind">默一默 · 第 1 步：看仔细 <span class="enl">Step 1: Look</span></div>
        ${grid(w.w,{syl:w.syl,id:"lk"})}<div class="meaning">${esc(w.cn||"")}</div>`,
        `${sayBtns(w,true)}
        <p class="muted" style="margin:0">${wrongOnce?"刚才写错的地方要特别看清楚。Look closely at the part you got wrong.":"注意每个字母的顺序，在心里拼一遍。Spell it in your head."}</p>
        <div><button class="btn primary big" id="go">${L("盖住，我来写","Cover it, I'll write")}</button></div>`);
      bindSay(st,w,"lk"); $("#go").onclick=()=>{phase="write";draw();};
    }else{
      st.innerHTML=panes(`<div class="kind">默一默 · 第 2 步：盖住后写 <span class="enl">Step 2: Cover &amp; Write</span></div>
        <div class="cover">已经盖住了 🙈 Covered</div><div class="meaning">${esc(w.cn||"")}</div>`,
        `<input ${inputAttrs} class="answer" id="ans" placeholder="在这里写 Type here">
        <div><button class="btn primary big" id="chk">${L("检查","Check")}</button></div><div id="fb"></div>`);
      const inp=$("#ans"); focusIn(inp);
      const check=()=>{
        if(!inp.value.trim())return;
        if(norm(inp.value)===norm(w.w)){beep(true);inp.classList.add("ok");$("#fb").innerHTML=`<div class="fb ok">写对了！Correct!</div>`;say(w.w);setTimeout(next,1000);}
        else{beep(false);wrongOnce=true;inp.classList.add("no");
          $("#fb").innerHTML=`<div class="fb no">${diffHtml(inp.value,w.w)}</div><div style="margin-top:12px"><button class="btn primary big" id="again">${L("再看一遍，重写","Look again and rewrite")}</button></div>`;
          $("#again").onclick=()=>{phase="look";draw();}; $("#chk").disabled=true;}
      };
      $("#chk").onclick=check; inp.onkeydown=e=>{if(e.key==="Enter")check();};
    }
  };
  draw();
}

/* 听写 Dictation (dict) 与 默写 Write from memory (mx) */
function tDict(st,task,w){
  const r=S.res[w.id], mx=task.t==="mx";
  const left=mx
    ?`<div class="kind">默写${task.retry?" · 再写一次":""} <span class="enl">Write from memory${task.retry?" · again":""}</span></div>
      <div class="meaning huge">${esc(w.cn||"？")}</div>
      <div class="say"><button class="btn" data-s="n">${L("🔊 听一听","Hint: listen")}</button><button class="btn" id="first">${L("首字母","First letter")}</button></div>
      <div id="hint" class="muted"></div>`
    :`<div class="kind">听写${task.retry?" · 再写一次":""} <span class="enl">Dictation${task.retry?" · again":""}</span></div>
      <div class="headphones">🎧</div>
      <div class="say"><button class="btn" data-s="n">${L("🔊 再听一遍","Play again")}</button><button class="btn" data-s="slow">${L("🐢 慢读","Slow")}</button></div>
      <div class="meaning" style="font-size:20px">提示 Hint：${esc(w.cn||"听发音 listen")}</div>`;
  st.innerHTML=panes(left,`<input ${inputAttrs} class="answer" id="ans" placeholder="${mx?"写出英文 Write the English":"听到什么写什么 Write what you hear"}">
    <div><button class="btn primary big" id="chk">${L("检查","Check")}</button></div><div id="fb"></div>`);
  bindSay(st,w);
  if(!mx)setTimeout(()=>say(w.w),250);
  const fb=$("#first"); if(fb)fb.onclick=()=>{$("#hint").innerHTML=`首字母 First letter: <b style="font:26px var(--word);color:var(--ink)">${esc(w.w[0])}</b> · ${w.w.replace(/ /g,"").length} 个字母 letters`;};
  const inp=$("#ans"); focusIn(inp);
  let copying=false;
  const check=()=>{
    if(!inp.value.trim())return;
    const ok=norm(inp.value)===norm(w.w);
    if(copying){
      if(ok){beep(true);S.tasks.push({t:task.t,id:w.id,retry:true});next();}
      else{beep(false);inp.classList.add("no");}
      return;
    }
    r.tries++;
    if(r.first===null)r.first=ok;
    if(ok){beep(true);inp.classList.add("ok");$("#fb").innerHTML=`<div class="fb ok">正确！Correct! <b style="font:24px var(--word)">${esc(w.w)}</b></div>`;say(w.w);setTimeout(next,1000);}
    else{
      beep(false);inp.classList.add("no");say(w.w,{slow:true});
      const canRetry=r.tries<3;
      $("#fb").innerHTML=`<div class="fb no">${diffHtml(inp.value,w.w)}</div>
        ${canRetry?`<p class="muted">看着正确的单词，在上面照着写一遍，这个词待会儿还要再考。<br>Copy the correct word into the box above. It will come back later.</p>`:`<div style="margin-top:12px"><button class="btn primary big" id="go">${L("下一个","Next")}</button></div>`}`;
      if(canRetry){copying=true;inp.value="";inp.classList.remove("no");$("#chk").innerHTML=L("照着写好了","Copied it");focusIn(inp);}
      else $("#go").onclick=next;
    }
  };
  $("#chk").onclick=check; inp.onkeydown=e=>{if(e.key==="Enter")check();};
}

function tDone(st){
  clearInterval(timerH);
  const t=today(), ids=S.ids, list=ids.map(id=>state.words[id]);
  const right=ids.filter(id=>S.res[id].first===true).length;
  if(S.mode==="learn"||S.mode==="review"){ // 更新复习计划 Update review plan
    list.forEach(w=>{
      const ok=S.res[w.id].first===true;
      if(S.mode==="learn"){w.stage=1;w.due=addDays(t,INTERVAL[1]);w.learnedOn=t;if(!ok)w.lapses=(w.lapses||0)+1;}
      else if(ok){w.stage=Math.min(w.stage+1,INTERVAL.length-1);w.due=addDays(t,INTERVAL[w.stage]);}
      else{w.stage=1;w.due=addDays(t,1);w.lapses=(w.lapses||0)+1;}
    });
  }else list.forEach(w=>{if(S.res[w.id].first===false)w.lapses=(w.lapses||0)+1;});
  const lg=state.log[t]||(state.log[t]={done:0,right:0});
  lg.done+=ids.length; lg.right+=right;
  let extra="";
  if(S.mode==="game"){
    const sec=Math.round((Date.now()-S.t0)/1000), acc=Math.round(S.hits/Math.max(1,S.hits+S.misses)*100);
    const rec=S.score>(state.best||0); if(rec)state.best=S.score;
    extra=`<div class="stat-row"><div class="stat"><b>${S.score}</b>分数 Score</div><div class="stat"><b>${Math.floor(sec/60)}:${pad(sec%60)}</b>用时 Time</div><div class="stat"><b>${acc}%</b>准确率 Accuracy</div></div>
      ${rec?`<div class="fb ok" style="font-size:18px">🏆 新纪录！New best score!</div>`:`<div class="muted">最高分 Best: ${state.best}</div>`}`;
  }
  save();
  const ratio=right/Math.max(1,ids.length), stars=ratio>=.95?3:ratio>=.7?2:1;
  const schedule=S.mode==="learn"||S.mode==="review";
  st.innerHTML=`<div class="full"><div class="stars">${"★".repeat(stars)}<span style="opacity:.25">${"★".repeat(3-stars)}</span></div>
    <h2 style="font-size:28px">${stars===3?"太棒了！":stars===2?"很不错！":"坚持就是进步！"}<br><span class="enl" style="margin:0">${stars===3?"Excellent!":stars===2?"Great job!":"Keep going!"}</span></h2>
    <p class="muted" style="margin:0">第一次就对 <b>${right}</b> / ${ids.length} · First try correct${schedule?"":"（练习，不改变复习计划 Practice only）"}</p>
    ${extra}
    <div class="card res-list"><div class="bank-list">${list.map(w=>{const ok=S.res[w.id].first===true;
      return `<div class="item"><span class="${ok?"ok-t":"no-t"}">${ok?"✔":"✘"}</span><div><span style="font:21px var(--word);color:var(--ink)">${esc(w.w)}</span> <span class="muted">${esc(w.cn||"")}</span></div>
      <span class="muted" style="font-size:12px">${schedule?(dayDiff(t,w.due)===1?"明天复习 Tomorrow":dayDiff(t,w.due)+" 天后 in "+dayDiff(t,w.due)+" days"):""}</span></div>`;}).join("")}</div></div>
    <div class="row" style="justify-content:center">
      ${S.mode==="game"?`<button class="btn sun big" id="again">${L("再玩一次","Play again")}</button>`:""}
      <button class="btn primary big" id="fin">${L("完成","Finish")}</button></div></div>`;
  $("#fin").onclick=endSession;
  const ag=$("#again"); if(ag)ag.onclick=()=>{const ids2=S.ids;startSession("game",ids2);};
  beep(true,true);
}
