<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Speller</title>
<meta name="theme-color" content="#2742a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Speller">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Exercise-book look: ballpoint blue, red-pen marking, four-line handwriting grid. Two columns on iPad landscape. */
:root{
  --bg:#eef2f8; --paper:#ffffff; --fg:#1d2433; --muted:#5d6a82; --soft:#e3e9f4;
  --ink:#2742a8; --on-ink:#ffffff; --ink-soft:#e4e9fb; --red:#d8342c; --red-soft:#fde8e6;
  --green:#1d8a4c; --green-soft:#e2f5ea; --sun:#f5b301; --sun-soft:#fff4d1; --line:#9fb3d6; --baseline:#e38d8d;
  --word:"Andika","Comic Sans MS",system-ui,sans-serif;
  --round:"Fredoka",system-ui,-apple-system,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1422; --paper:#172036; --fg:#e6ebf5; --muted:#9aa6bf; --soft:#222d47;
  --ink:#8fa8ff; --on-ink:#0e1422; --ink-soft:#1f2b52; --red:#ff7b72; --red-soft:#3a1e22;
  --green:#5fd394; --green-soft:#143126; --sun:#ffc93c; --sun-soft:#3a3016; --line:#3d4f78; --baseline:#a55a5a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:17px/1.55 var(--body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:env(safe-area-inset-top,0)}
.brand{font:600 24px/1.1 var(--round);color:var(--ink);display:flex;align-items:center;gap:10px}
.brand svg{width:36px;height:36px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--paper);color:var(--muted);font-size:14px;border:0;min-height:36px}
.chip.kid{color:var(--ink);font-weight:700}
.chip.ok{color:var(--green)} .chip.warn{color:var(--red)}
.spacer{flex:1}
nav.tabs{display:flex;gap:6px;margin:14px 0 18px;background:var(--soft);padding:5px;border-radius:14px}
nav.tabs button{flex:1;border:0;background:transparent;padding:12px 4px;border-radius:10px;font:600 17px var(--round);color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
nav.tabs[hidden]+main{margin-top:16px}
h2{font:600 24px/1.25 var(--round);margin:0 0 6px;text-wrap:balance}
h3{font:600 19px/1.3 var(--round);margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--paper);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:10px 18px;font:600 17px var(--round);background:var(--soft);color:var(--fg);min-height:50px}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.big{padding:12px 28px;font-size:20px;min-height:62px}
.btn.sun{background:var(--sun);color:#3a2a00}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.words{display:flex;flex-wrap:wrap;gap:6px}
.w{font:20px var(--word);background:var(--ink-soft);color:var(--ink);padding:2px 12px;border-radius:8px}
.date{font:600 32px/1.1 var(--round)}
.grid-home{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){.grid-home{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid-home{grid-template-columns:1fr}}
.big-num{font:600 40px/1 var(--round);color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;counter-reset:s}
@media (max-width:700px){.steps{grid-template-columns:1fr 1fr}}
.step{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted)}
.step b{display:block;font:600 17px var(--round);color:var(--fg)}
.step b::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:13px;margin-right:6px;vertical-align:2px}
.forecast{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:13px}
.forecast .bar{height:54px;display:flex;align-items:flex-end;justify-content:center}
.forecast .bar i{display:block;width:60%;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.forecast .n{font:600 14px var(--round);font-variant-numeric:tabular-nums}
textarea,input[type=text]{width:100%;border:2px solid var(--soft);background:var(--paper);color:var(--fg);border-radius:12px;padding:10px 12px;font:20px/1.5 var(--word)}
textarea{min-height:240px;resize:vertical}
label.opt{display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:12px;background:var(--soft);cursor:pointer;min-height:46px;font-weight:600}
label.opt:has(input:checked){background:var(--ink-soft);color:var(--ink)}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:800px){.add-grid{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.bank-list{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
@media (max-width:800px){.bank-list{grid-template-columns:1fr}}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}
.item .en{font:23px var(--word);color:var(--ink);overflow-wrap:anywhere}
.ipa{font:17px var(--word);color:var(--muted)}
.dots{display:flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--soft)}
.dots i.on{background:var(--green)}
.icon-btn{border:0;background:var(--soft);border-radius:12px;min-width:46px;height:46px;display:inline-grid;place-items:center;font-size:19px;padding:0 10px}
.icon-btn.confirm{background:var(--red);color:#fff;font-size:14px;font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.filters button,.seg button{border:0;border-radius:999px;padding:6px 16px;background:var(--soft);font-size:15px;min-height:42px;font-weight:600}
.filters button.on,.seg button.on{background:var(--ink);color:var(--on-ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.notice{padding:10px 14px;border-radius:10px;background:var(--ink-soft);color:var(--ink);font-size:15px}
.notice.warn{background:var(--red-soft);color:var(--red)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:800px){.modes{grid-template-columns:1fr 1fr}}
.mode{text-align:left;background:var(--paper);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-height:150px;border:2px solid transparent}
.mode:hover{border-color:var(--ink-soft)}
.mode .ic{font-size:32px;line-height:1}
.mode b{font:600 21px var(--round)}
.mode span.d{font-size:14px;color:var(--muted)}
.mode.game{background:var(--sun-soft)}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.kid{border:2px solid var(--soft);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;background:var(--paper);text-align:left}
.kid .nm{font:600 24px/1.2 var(--round);overflow-wrap:anywhere}
.ava{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 26px var(--round);flex:none;background:var(--ink)}
.login{display:flex;gap:10px;flex-wrap:wrap}
.login input{flex:1;min-width:200px;font:600 26px var(--round);text-transform:none}

/* ===== Practice screen ===== */
#session{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.s-top{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left));max-width:1180px;width:100%;margin:0 auto}
.s-label{font:600 18px/1.2 var(--round);color:var(--ink);white-space:nowrap}
.prog{flex:1;height:12px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.hud{display:flex;gap:8px;font:600 16px var(--round);font-variant-numeric:tabular-nums}
.hud span{background:var(--paper);border-radius:10px;padding:4px 10px;white-space:nowrap}
.hud .combo{background:var(--sun);color:#3a2a00}
.s-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.stage{max-width:640px;margin:0 auto;padding:10px 16px 30px;display:flex;flex-direction:column;gap:16px;text-align:center}
.pa,.pb,.full{display:flex;flex-direction:column;gap:14px;min-width:0}
.pa{container-type:inline-size}
@media (min-width:880px) and (orientation:landscape){
  .stage{max-width:1180px;display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:start;padding:18px 28px 30px}
  .stage > .full{grid-column:1/-1;max-width:760px;margin:0 auto;width:100%}
  .pa{position:sticky;top:0;background:var(--paper);border-radius:22px;padding:22px}
  .pb{padding-top:6px}
}
.kind{font:600 15px var(--round);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.grid4{display:block;width:100%;--h:min(42px,7.5vh,calc(100cqw / (var(--n) * 1.12)));height:calc(var(--h) * 3 + 2px);overflow:visible}
.grid4 line{stroke:var(--line);stroke-width:1}
.grid4 line.base{stroke:var(--baseline);stroke-width:1.5}
.grid4 text{font-family:var(--word);font-size:calc(var(--h) * 2);fill:var(--fg)}
.grid4 .s1{fill:var(--ink)} .grid4 .s2{fill:var(--red)}
.grid4 .hl{fill:var(--sun)}
.syl{font:24px var(--word);color:var(--muted);letter-spacing:.02em}
.syl b{font-weight:400;color:var(--ink)} .syl b:nth-child(even){color:var(--red)}
.ex{background:var(--bg);border-radius:12px;padding:10px 14px;text-align:left;font:20px var(--word)}
.tip{background:var(--green-soft);color:var(--green);border-radius:12px;padding:8px 14px;text-align:left;font-size:15px}
.say{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.say .btn{min-width:100px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt-btn{border:2px solid var(--soft);background:var(--paper);border-radius:16px;padding:16px 10px;font:28px var(--word);min-height:80px;overflow-wrap:anywhere}
.opt-btn.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt-btn.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:44px;height:56px;border-bottom:3px solid var(--line);font:34px/54px var(--word);color:var(--green)}
.slot.given{color:var(--muted)}
.slot.next{border-bottom-color:var(--ink)}
.slot.gap{border:0;width:16px}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:62px;height:66px;border:0;border-radius:14px;background:var(--paper);font:34px var(--word);color:var(--ink);box-shadow:0 4px 0 var(--soft)}
@media (min-width:880px) and (orientation:landscape){.tile{width:70px;height:74px;font-size:38px}}
.tile.used{visibility:hidden}
.tile.bad{animation:shake .35s;background:var(--red-soft);color:var(--red)}
.tile.hint{outline:3px dashed var(--sun)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .3s}
@media (prefers-reduced-motion:reduce){.tile.bad,.pop{animation:none}.prog i{transition:none}}
.answer{font:32px var(--word);text-align:center;letter-spacing:.04em;padding:12px}
.answer.ok{border-color:var(--green)} .answer.no{border-color:var(--red)}
.fb{border-radius:12px;padding:12px;font-size:17px}
.fb.ok{background:var(--green-soft);color:var(--green)}
.fb.no{background:var(--red-soft);color:var(--red)}
.diff{font:30px var(--word);letter-spacing:.04em}
.diff .x{color:var(--red);text-decoration:line-through}
.diff .m{color:var(--red);background:var(--red-soft);border-radius:4px}
.diff .k{color:var(--green)}
.cover{height:120px;border-radius:12px;background:repeating-linear-gradient(45deg,var(--soft) 0 12px,var(--paper) 12px 24px);display:grid;place-items:center;color:var(--muted);font:600 20px var(--round)}
.headphones{font-size:80px;line-height:1}
.stars{font-size:46px;letter-spacing:4px;color:var(--sun)}
.res-list{text-align:left}
.ok-t{color:var(--green);font-weight:700} .no-t{color:var(--red);font-weight:700}
.stat-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stat{background:var(--paper);border-radius:14px;padding:10px 18px;min-width:120px}
.stat b{display:block;font:600 30px var(--round);color:var(--ink);font-variant-numeric:tabular-nums}
#soundTip{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="3" width="24" height="26" rx="4" fill="var(--ink)"/><g stroke="var(--paper)" stroke-width="1.4" opacity=".9"><line x1="8" y1="11" x2="24" y2="11"/><line x1="8" y1="15" x2="24" y2="15"/><line x1="8" y1="19" x2="24" y2="19"/><line x1="8" y1="23" x2="24" y2="23"/></g><path d="M9 20.5l3-6 3 6M10 18.8h4" stroke="var(--sun)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      Word Speller
    </div>
    <span class="spacer"></span>
    <button class="chip kid" id="kid"></button>
    <span class="chip" id="sync"></span>
    <span class="chip" id="streak"></span>
    <button class="chip" id="soundTest">🔊 Test sound</button>
    <button class="chip" id="accent"></button>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today">Today</button>
    <button role="tab" data-tab="practice">Practice</button>
    <button role="tab" data-tab="tomorrow">Tomorrow</button>
    <button role="tab" data-tab="add">Add Words</button>
    <button role="tab" data-tab="bank">My Words</button>
  </nav>
  <main id="view"></main>
</div>
<div id="soundTip" class="notice warn" hidden></div>

<section id="session" hidden>
  <div class="s-top">
    <button class="icon-btn" id="quit" aria-label="Quit">✕</button>
    <span class="s-label" id="sLabel"></span>
    <div class="prog"><i id="sProg"></i></div>
    <div class="hud" id="hud" hidden><span id="hScore"></span><span class="combo" id="hCombo" hidden></span><span id="hTime"></span></div>
  </div>
  <div class="s-body"><div class="stage" id="stage"></div></div>
</section>

<script>
"use strict";
/* ---------------- Cloud database (Supabase, table word_books) ---------------- */
const SB_URL="https://mztoenhgfuomzrashrqk.supabase.co";
const SB_KEY="sb_publishable_pOM3IfVWYiscQ-cz9vAwvA_F2Ht6zg1";
const SB_H={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};
async function cloudGet(key){
  const r=await fetch(`${SB_URL}/rest/v1/word_books?name=eq.${encodeURIComponent(key)}&select=data,updated_at`,{headers:SB_H,cache:"no-store"});
  if(!r.ok)throw new Error("cloud "+r.status);
  const a=await r.json(); return a[0]||null;
}
async function cloudPut(key,book,keepalive){
  const r=await fetch(`${SB_URL}/rest/v1/word_books`,{method:"POST",keepalive:!!keepalive,
    headers:{...SB_H,Prefer:"resolution=merge-duplicates,return=minimal"},
    body:JSON.stringify([{name:key,data:book,updated_at:new Date().toISOString()}])});
  if(!r.ok)throw new Error("cloud "+r.status);
}

/* ---------------- Utils ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dstr(new Date());
const pdate=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=pdate(s);d.setDate(d.getDate()+n);return dstr(d);};
const dayDiff=(a,b)=>Math.round((pdate(b)-pdate(a))/864e5);
const WEEK=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH=["January","February","March","April","May","June","July","August","September","October","November","December"];
const niceDate=s=>{const d=pdate(s);return `${WEEK[d.getDay()]}, ${MONTH[d.getMonth()]} ${d.getDate()}`;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s).toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g," ").trim();
const uid=()=>Math.random().toString(36).slice(2,10);
const keyOf=name=>name.trim().toLowerCase().replace(/\s+/g," ");

/* Spaced review: after learning, words come back after 1, 2, 4, 7, 15, 30 and 60 days */
const INTERVAL=[0,1,2,4,7,15,30,60];
const MASTER=7;

/* ---------------- Local storage (cache of every child's book on this device) ---------------- */
const KEY="gc-words-v3";
let root={v:3,accent:"us",current:null,books:{}};
try{
  const raw=localStorage.getItem(KEY);
  if(raw){const r=JSON.parse(raw); if(r&&r.books)root=Object.assign(root,r);}
  else{ // bring over data from older versions
    const v2=JSON.parse(localStorage.getItem("gc-words-v2")||"null");
    const v1=JSON.parse(localStorage.getItem("gc-words-v1")||"null");
    if(v2&&v2.profiles){root.accent=v2.accent||"us";Object.values(v2.profiles).forEach(p=>{if(Object.keys(p.words||{}).length)root.books[keyOf(p.name)]={name:p.name,words:p.words,log:p.log||{},best:p.best||0,updated:1};});}
    else if(v1&&v1.words&&Object.keys(v1.words).length){root.accent=v1.accent||"us";root.books["my child"]={name:"My Child",words:v1.words,log:v1.log||{},best:v1.best||0,updated:1};}
  }
}catch(e){}
const blankBook=name=>({name,words:{},log:{},best:0,updated:0});
let state=root.books[root.current]||null;
if(!state){root.current=null;state=blankBook("");}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(root));}catch(e){}}

/* Sync: every change is saved on this device at once and sent to the cloud a moment later */
let syncState="idle", syncTimer=null, pushing=false, pending=false;
function setSync(s){syncState=s;const c=$("#sync");if(!c)return;
  c.className="chip "+(s==="saved"?"ok":s==="error"?"warn":"");
  c.textContent={idle:"",loading:"☁️ Loading…",saving:"☁️ Saving…",saved:"☁️ Saved",error:"⚠️ Not saved online yet"}[s]||"";
  c.hidden=!root.current||!c.textContent;
  c.title=s==="error"?"Saved on this device. It will upload when the internet is back.":"";
}
function save(){
  if(!root.current)return;
  state.updated=Date.now(); saveLocal();
  clearTimeout(syncTimer); syncTimer=setTimeout(pushNow,1200); setSync("saving");
}
async function pushNow(keepalive){
  if(!root.current)return;
  if(pushing){pending=true;return;}
  pushing=true;
  const key=root.current, book=state;
  try{await cloudPut(key,book,keepalive);setSync("saved");}
  catch(e){setSync("error");clearTimeout(syncTimer);syncTimer=setTimeout(pushNow,30000);}
  pushing=false;
  if(pending){pending=false;pushNow();}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&syncState==="saving"){clearTimeout(syncTimer);pushNow(true);}});
window.addEventListener("online",()=>{if(syncState==="error")pushNow();});
/* Open a child's book by name: the newest copy (cloud or this device) wins */
async function openBook(name){
  const key=keyOf(name); if(!key)return;
  root.current=key;
  let local=root.books[key];
  setSync("loading");
  try{
    const row=await cloudGet(key);

function say(text,{slow=false,onend}={}){

/* ---------------- Syllables (a simple rule-based split to show word chunks) ---------------- */
function syllables(word){
  if(/[^a-z']/i.test(word)||word.length<4)return [word];
  const lw=word.toLowerCase(), n=lw.length;
  const isV=i=>"aeiou".includes(lw[i])||(lw[i]==="y"&&i>0&&!"aeiou".includes(lw[i-1]));
  const g=[]; for(let i=0;i<n;){if(isV(i)){let j=i;while(j<n&&isV(j))j++;g.push([i,j]);i=j;}else i++;}
  if(g.length>1){const last=g[g.length-1];
    if(last[0]===n-1&&lw[n-1]==="e"&&!(lw[n-2]==="l"&&n>2&&!isV(n-3)))g.pop();
    else if(last[0]===n-2&&/e[sd]$/.test(lw)&&!/[td]ed$|[sxz]es$|[cs]hes$/.test(lw))g.pop();}
  if(g.length<2)return [word];
  const DI=["ch","sh","th","ph","wh","gh"], AFTER=["ck","ng"], BL=["bl","br","cl","cr","dr","fl","fr","gl","gr","pl","pr","tr","wr"];
  const cuts=[];
  for(let k=0;k<g.length-1;k++){
    const s=g[k][1], e=g[k+1][0], num=e-s; let cut;
    if(k===g.length-2&&e===n-1&&lw[n-1]==="e"&&lw[n-2]==="l")cut=e-2;
    else if(num<=1)cut=lw[s]==="x"?s+1:s;
    else{const p=lw.slice(s,s+2);
      if(num===2&&(DI.includes(p)||BL.includes(p)))cut=s;
      else if(AFTER.includes(p))cut=s+2;
      else cut=s+1;}
    if(cut>(cuts[cuts.length-1]||0)&&cut<n)cuts.push(cut);
  }
  const out=[];let p=0;cuts.forEach(c=>{out.push(word.slice(p,c));p=c;});out.push(word.slice(p));
  return out.filter(Boolean);
}

/* ---------------- Four-line handwriting grid ---------------- */
function grid(word,{id="g",color=true}={}){
  const n=Math.max(word.length,5);
  let spans="", i=0;
  const parts=color?syllables(word):[word];
  parts.forEach((p,k)=>{for(const ch of p){
    const cls=parts.length>1?(k%2?"s2":"s1"):"";
    spans+=`<tspan data-i="${i}" class="${cls}">${esc(ch===" "?"\u00a0":ch)}</tspan>`; i++;}});
  return `<svg class="grid4" id="${id}" style="--n:${n}" aria-label="${esc(word)}">
    <line x1="0" x2="100%" y1="1" y2="1"/><line x1="0" x2="100%" y1="33.33%" y2="33.33%"/>
    <line class="base" x1="0" x2="100%" y1="66.67%" y2="66.67%"/><line x1="0" x2="100%" y1="99%" y2="99%"/>
    <text x="50%" y="66.67%" text-anchor="middle">${spans}</text></svg>`;
}
const sylHtml=w=>{const s=syllables(w);return s.length>1?`<div class="syl">${s.map(x=>`<b>${esc(x)}</b>`).join(" · ")}</div>`:"";};

/* ---------------- Word input ---------------- */
function parseInput(text){
  const out=[], seen=new Set();
  text.split(/[\n,;，；、]+/).forEach(chunk=>{
    const w=chunk.replace(/[^A-Za-z'’\- ]+/g," ").replace(/\s+/g," ").replace(/^[\s'\-]+|[\s'\-]+$/g,"").trim();
    if(w&&/[a-z]/i.test(w)&&!seen.has(w.toLowerCase())){seen.add(w.toLowerCase());out.push(w);}
  });
  return out;
}

/* Online lookup: phonetic spelling, a short example sentence, and a recorded pronunciation */
async function enrich(word){
  if(word.ipa&&word.ex&&word.audio)return;
  const j=await fetchJSON("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word.w.toLowerCase()));
  if(!Array.isArray(j))return;
  const e=j[0]; const phs=e.phonetics||[];
  const ph=e.phonetic||phs.map(p=>p.text).find(Boolean);
  if(ph&&!word.ipa)word.ipa=ph.startsWith("/")?ph:"/"+ph+"/";
  const au=phs.find(p=>p.audio&&/-us\./.test(p.audio))||phs.find(p=>p.audio);
  if(au&&!word.audio)word.audio=au.audio;
  if(!word.ex){
    for(const m of e.meanings||[])for(const d of m.definitions||[])
      if(d.example&&d.example.split(" ").length<=12&&new RegExp("\\b"+word.w.split(" ")[0],"i").test(d.example)){word.ex=d.example.replace(/^./,c=>c.toUpperCase());return;}
  }
}

/* ---------------- Misspellings for "Pick the right spelling" ---------------- */
function misspellings(w){
  const s=w.toLowerCase(), out=new Set(), V="aeiou";
  for(let i=1;i<s.length-1;i++)if(s[i]!==s[i+1]&&s[i]!==" "&&s[i+1]!==" ")out.add(s.slice(0,i)+s[i+1]+s[i]+s.slice(i+2)); // swap two letters
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(i<s.length-1&&c===s[i+1])out.add(s.slice(0,i)+s.slice(i+1)); // one letter instead of two
    else if(/[bcdfglmnprst]/.test(c)&&i>0)out.add(s.slice(0,i)+c+s.slice(i)); // double a letter
    if(V.includes(c)){out.add(s.slice(0,i)+s.slice(i+1)); for(const v of V)if(v!==c)out.add(s.slice(0,i)+v+s.slice(i+1));} // drop or change a vowel
  }
  [["ie","ei"],["ei","ie"],["ph","f"],["c","k"],["k","c"],["tion","shun"],["ck","k"],["ee","ea"],["ea","ee"],["ou","ow"],["ow","ou"],["y","ie"],["er","ur"],["ai","ay"],["ay","ai"]]
    .forEach(([a,b])=>{if(s.includes(a))out.add(s.replace(a,b));});
  out.delete(s);
  const fix=x=>w[0]===w[0].toUpperCase()?x[0].toUpperCase()+x.slice(1):x;
  return shuffle([...out].filter(x=>x.length>1&&x.trim()===x)).slice(0,3).map(fix);
}

let S=null, timerH=null;
const MODE_NAME={learn:"New Words",review:"Review",full:"All 5 Steps",dict:"Dictation",lcwc:"Cover & Write",game:"Spelling Game"};
function fullTasks(ids,tasks){
  const groups=[]; for(let i=0;i<ids.length;i+=5)groups.push(ids.slice(i,i+5));
  groups.forEach((g,k)=>{
    tasks.push({t:"intro",title:groups.length>1?`Group ${k+1} of ${groups.length}`:`${g.length} new word${g.length===1?"":"s"}`,sub:"First look and listen. Then pick, build and write.",ids:g});
    g.forEach(id=>tasks.push({t:"preview",id}));
    shuffle(g).forEach(id=>tasks.push({t:"pick",id}));
    shuffle(g).forEach(id=>tasks.push({t:"tiles",id}));
    shuffle(g).forEach(id=>tasks.push({t:"lcwc",id}));
  });
  tasks.push({t:"intro",title:"Final dictation",sub:`Listen and write all ${ids.length} words. Any mistakes come back once more.`});
  shuffle(ids).forEach(id=>tasks.push({t:"dict",id}));
}
function startSession(mode,ids){
  ids=ids.filter(id=>state.words[id]); if(!ids.length)return;
  const tasks=[], n=ids.length, s=n===1?"":"s";
  if(mode==="learn"||mode==="full")fullTasks(ids,tasks);
  else if(mode==="review"){
    tasks.push({t:"intro",title:`Review ${n} word${s}`,sub:"Pick the right spelling, then write each word from dictation."});
    shuffle(ids).forEach(id=>tasks.push({t:"pick",id}));
    shuffle(ids).forEach(id=>tasks.push({t:"dict",id}));
  }else if(mode==="dict"){
    tasks.push({t:"intro",title:`Dictation · ${n} word${s}`,sub:"Listen, type the word, then press Enter or Check. Tap Sentence to hear it used."});
    shuffle(ids).forEach(id=>tasks.push({t:"dict",id}));
  }else if(mode==="lcwc"){
    tasks.push({t:"intro",title:`Cover & Write · ${n} word${s}`,sub:"Look carefully, cover the word, write it from memory, then check."});
    shuffle(ids).forEach(id=>tasks.push({t:"lcwc",id}));
  }else if(mode==="game"){
    tasks.push({t:"intro",title:`Spelling Game · ${n} word${s}`,sub:"Listen and tap the letters in order. Streaks earn bonus points, wrong taps lose points. Be quick!",game:true});
    shuffle(ids).forEach(id=>tasks.push({t:"game",id,kind:Math.random()<.5?"build":"gap"}));
  }
  S={mode,ids,tasks,i:0,res:Object.fromEntries(ids.map(id=>[id,{first:null,tries:0}])),score:0,combo:0,hits:0,misses:0,t0:0};
  $("#hud").hidden=mode!=="game";
  $("#session").hidden=false; document.body.style.overflow="hidden";
  renderTask();
}

/* Letter tiles, used by Build and the Spelling Game */
let kbHandler=null;
function letterBoard(st,w,{blanks,extra=0,onHit,onMiss,onDone,hintAfter=3}){
  const letters=[...w.w];
  const need=blanks.slice();
  const pool=need.map(i=>letters[i]);
  const abc="abcdefghijklmnopqrstuvwxyz".split("").filter(c=>!letters.map(x=>x.toLowerCase()).includes(c));
  for(let k=0;k<extra;k++)pool.push(abc[Math.random()*abc.length|0]);
  const tiles=shuffle(pool.map((c,k)=>({c,k})));
  let pos=0, miss=0; const filled=new Set();
  const slotsHtml=()=>letters.map((c,i)=>c===" "?`<span class="slot gap"></span>`:
    need.includes(i)?`<span class="slot ${filled.has(i)?"":i===need[pos]?"next":""}">${filled.has(i)?esc(c):""}</span>`:`<span class="slot given">${esc(c)}</span>`).join("");
  $("#slots").innerHTML=slotsHtml();
  $("#tiles").innerHTML=tiles.map((t,k)=>`<button class="tile" data-k="${k}">${esc(t.c)}</button>`).join("");
  const tap=b=>{
    if(pos>=need.length||b.classList.contains("used"))return;
    const t=tiles[b.dataset.k], want=letters[need[pos]];
    if(t.c.toLowerCase()===want.toLowerCase()){
      b.classList.add("used"); filled.add(need[pos]); pos++; $("#slots").innerHTML=slotsHtml();
      st.querySelectorAll(".tile.hint").forEach(x=>x.classList.remove("hint"));
      onHit&&onHit();
      if(pos===need.length){document.removeEventListener("keydown",kbHandler);onDone(miss);}
    }else{
      miss++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad");
      onMiss&&onMiss();
      if(miss>=hintAfter){const h=[...st.querySelectorAll(".tile:not(.used)")].find(x=>tiles[x.dataset.k].c.toLowerCase()===letters[need[pos]].toLowerCase()); if(h)h.classList.add("hint");}
    }
  };
  st.querySelectorAll(".tile").forEach(b=>b.onclick=()=>tap(b));
  // a physical keyboard works too
  if(kbHandler)document.removeEventListener("keydown",kbHandler);
  kbHandler=e=>{if(!S||e.key.length!==1||!/[a-z'\-]/i.test(e.key))return;
    const cand=[...st.querySelectorAll(".tile:not(.used)")]; if(!cand.length)return;
    const b=cand.find(x=>tiles[x.dataset.k].c.toLowerCase()===e.key.toLowerCase()&&pos<need.length&&e.key.toLowerCase()===letters[need[pos]].toLowerCase())||cand.find(x=>tiles[x.dataset.k].c.toLowerCase()===e.key.toLowerCase())||cand[0];
    tap(b);};
  document.addEventListener("keydown",kbHandler);
}

function tGame(st,task,w){
  const idx=[...w.w].map((c,i)=>c===" "?-1:i).filter(i=>i>=0);
  let blanks=idx;
  if(task.kind==="gap"&&idx.length>=3){const k=Math.min(idx.length-1,Math.max(2,Math.round(idx.length*.5)));blanks=shuffle(idx).slice(0,k).sort((a,b)=>a-b);}
  const n=S.tasks.filter(t=>t.t==="game").length, cur=S.tasks.slice(0,S.i+1).filter(t=>t.t==="game").length;
  st.innerHTML=panes(`<div class="kind">Word ${cur} of ${n} · ${blanks.length===idx.length?"Spell the whole word":"Fill in the missing letters"}</div>

  bindSay(st,w); say(w.w);

    onHit:()=>{S.hits++;S.combo++;S.score+=10+Math.min(S.combo,10)*2;beep(true);updHud();const h=$("#hScore");h.classList.remove("pop");void h.offsetWidth;h.classList.add("pop");},
    onMiss:()=>{S.misses++;S.combo=0;S.score=Math.max(0,S.score-3);updHud();if(S.res[w.id].first===null)S.res[w.id].first=false;},

      $("#fb").innerHTML=`<span class="ok-t" style="font-size:20px">${miss?"Done!":"Perfect! +20"}</span>`;
      beep(true,!miss); say(w.w); autoNext(1100);
    }});
}

function lcsMask(ans,cor){
  const a=[...norm(ans)],c=[...cor.toLowerCase()],m=a.length,n=c.length;
  const dp=[...Array(m+1)].map(()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=a[i]===c[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const keepA=Array(m).fill(false),keepC=Array(n).fill(false);let i=0,j=0;
  while(i<m&&j<n){if(a[i]===c[j]){keepA[i]=keepC[j]=true;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
  return {keepA,keepC};
}
function diffHtml(ans,cor){
  const {keepA,keepC}=lcsMask(ans,cor);
  const a=[...norm(ans)].map((ch,i)=>keepA[i]?`<span class="k">${esc(ch)}</span>`:`<span class="x">${esc(ch)}</span>`).join("")||"<span class='muted'>(empty)</span>";
  const c=[...cor].map((ch,i)=>keepC[i]?esc(ch):`<span class="m">${esc(ch)}</span>`).join("");
  return `<div class="muted small">You wrote</div><div class="diff">${a}</div><div class="muted small" style="margin-top:6px">Correct spelling (red letters are the ones to fix)</div><div class="diff" style="color:var(--fg)">${c}</div>`;
}

function tLcwc(st,task,w){
  let phase="look", wrongOnce=false;
  const r=S.res[w.id];
  const draw=()=>{
    if(phase==="look"){
      st.innerHTML=panes(`<div class="kind">Cover &amp; Write · Step 1: Look</div>
        ${grid(w.w,{id:"lk"})}${sylHtml(w.w)}`,
        `${sayBtns(w,{svg:"lk",sentence:false})}
        <p class="muted" style="margin:0;font-size:18px">${wrongOnce?"Look closely at the letters you missed.":"Look at every letter. Spell it in your head."}</p>
        <div><button class="btn primary big" id="go">Cover it, I'll write</button></div>`);
      bindSay(st,w,"lk"); $("#go").onclick=()=>{phase="write";draw();};
    }else{
      st.innerHTML=panes(`<div class="kind">Cover &amp; Write · Step 2: Write</div>
        <div class="cover">🙈 Covered</div>
        <div class="say"><button class="btn" data-s="n">🔊 Play</button></div>`,
        `<input ${inputAttrs} class="answer" id="ans" placeholder="Write the word">
        <div><button class="btn primary big" id="chk">Check</button></div><div id="fb"></div>`);
      bindSay(st,w);
      const inp=$("#ans"); focusIn(inp);
      const check=()=>{
        if(!inp.value.trim())return;
        const ok=norm(inp.value)===norm(w.w);
        if(r.first===null&&S.mode==="lcwc")r.first=ok;
        if(ok){beep(true);inp.classList.add("ok");$("#fb").innerHTML=`<div class="fb ok">Correct!</div>`;say(w.w);autoNext(1100);}
        else{beep(false);wrongOnce=true;inp.classList.add("no");
          $("#fb").innerHTML=`<div class="fb no">${diffHtml(inp.value,w.w)}</div><div style="margin-top:12px"><button class="btn primary big" id="again">Look again and rewrite</button></div>`;
          $("#again").onclick=()=>{phase="look";draw();}; $("#chk").disabled=true;}
      };
      $("#chk").onclick=check; inp.onkeydown=e=>{if(e.key==="Enter")check();};
    }
  };
  draw();
}

/* Dictation: hear it, write it. Mistakes are copied once, then asked again at the end. */
function tDict(st,task,w){
  const r=S.res[w.id];
  st.innerHTML=panes(`<div class="kind">Dictation${task.retry?" · one more time":""}</div>
      <div class="headphones">🎧</div>
      ${sayBtns(w,{})}`,
    `<input ${inputAttrs} class="answer" id="ans" placeholder="Write what you hear">
    <div><button class="btn primary big" id="chk">Check</button></div><div id="fb"></div>`);
  bindSay(st,w);
  say(w.w);
  const inp=$("#ans"); focusIn(inp);
  let copying=false;
  const check=()=>{
    if(!inp.value.trim())return;
    const ok=norm(inp.value)===norm(w.w);
    if(copying){
      if(ok){beep(true);S.tasks.push({t:"dict",id:w.id,retry:true});next();}
      else{beep(false);inp.classList.add("no");}
      return;
    }
    r.tries++;
    if(r.first===null)r.first=ok;
    if(ok){beep(true);inp.classList.add("ok");$("#fb").innerHTML=`<div class="fb ok">Correct! <b style="font:28px var(--word)">${esc(w.w)}</b></div>`;say(w.w);autoNext(1100);}
    else{
      beep(false);inp.classList.add("no");say(w.w,{slow:true});
      const canRetry=r.tries<3;
      $("#fb").innerHTML=`<div class="fb no">${diffHtml(inp.value,w.w)}</div>
        ${canRetry?`<p class="muted">Copy the correct spelling into the box above. This word will come back later.</p>`:`<div style="margin-top:12px"><button class="btn primary big" id="go">Next</button></div>`}`;
      if(canRetry){copying=true;inp.value="";inp.classList.remove("no");$("#chk").textContent="I copied it";focusIn(inp);}
      else $("#go").onclick=next;
    }
  };
  $("#chk").onclick=check; inp.onkeydown=e=>{if(e.key==="Enter")check();};
}

function tDone(st){
  clearInterval(timerH);
  const t=today(), ids=S.ids.filter(id=>state.words[id]), list=ids.map(id=>state.words[id]);
  const right=ids.filter(id=>S.res[id].first===true).length;
  const schedule=S.mode==="learn"||S.mode==="review";
  if(schedule){ // update the review plan
    list.forEach(w=>{
      const ok=S.res[w.id].first===true;
      if(S.mode==="learn"){w.stage=1;w.due=addDays(t,INTERVAL[1]);w.learnedOn=t;if(!ok)w.lapses=(w.lapses||0)+1;}
      else if(ok){w.stage=Math.min(w.stage+1,INTERVAL.length-1);w.due=addDays(t,INTERVAL[w.stage]);}
      else{w.stage=1;w.due=addDays(t,1);w.lapses=(w.lapses||0)+1;}
    });
  }else list.forEach(w=>{if(S.res[w.id].first===false)w.lapses=(w.lapses||0)+1;});
  const lg=state.log[t]||(state.log[t]={done:0,right:0});
  lg.done+=ids.length; lg.right+=right;
  let extra="";
  if(S.mode==="game"){
    const sec=Math.round((Date.now()-S.t0)/1000), acc=Math.round(S.hits/Math.max(1,S.hits+S.misses)*100);
    const rec=S.score>(state.best||0); if(rec)state.best=S.score;
    extra=`<div class="stat-row"><div class="stat"><b>${S.score}</b>Score</div><div class="stat"><b>${Math.floor(sec/60)}:${pad(sec%60)}</b>Time</div><div class="stat"><b>${acc}%</b>Accuracy</div></div>
      ${rec?`<div class="fb ok" style="font-size:20px">🏆 New best score!</div>`:`<div class="muted">Best score: ${state.best}</div>`}`;
  }
  save();
  const ratio=right/Math.max(1,ids.length), stars=ratio>=.95?3:ratio>=.7?2:1;
  st.innerHTML=`<div class="full"><div class="stars">${"★".repeat(stars)}<span style="opacity:.25">${"★".repeat(3-stars)}</span></div>
    <h2 style="font-size:34px">${stars===3?"Excellent!":stars===2?"Great job!":"Keep going, you're improving!"}</h2>
    <p class="muted" style="margin:0;font-size:18px">Right the first time: <b>${right}</b> of ${ids.length}${schedule?"":" · practice only"}</p>
    ${extra}
    <div class="card res-list"><div class="bank-list">${list.map(w=>{const ok=S.res[w.id].first===true;
      const dd=dayDiff(t,w.due);
      return `<div class="item"><span class="${ok?"ok-t":"no-t"}">${ok?"✔":"✘"}</span><div><span style="font:23px var(--word);color:var(--ink)">${esc(w.w)}</span></div>
      <span class="muted" style="font-size:13px">${schedule?(dd===1?"Review tomorrow":`Review in ${dd} days`):""}</span></div>`;}).join("")}</div></div>
    <div class="row" style="justify-content:center">
      ${S.mode==="game"?`<button class="btn sun big" id="again">Play again</button>`:""}
      <button class="btn primary big" id="fin">Finish</button></div></div>`;
  $("#fin").onclick=endSession;
  const ag=$("#again"); if(ag)ag.onclick=()=>startSession("game",S.ids);
  beep(true,true);
}

render();
/* On start, fetch the newest copy of the current child's words from the cloud */
if(root.current){(async()=>{const name=state.name||root.current;await openBook(name);if(!S)render();})();}
</script>
